name: Pokemon sealed import

# The Pokémon section's one importer (docs/pokemon/README.md). Since 2026-11-01
# it has NO database: it reads and writes the section's files in data/pokemon
# (src/lib/pokemon/store.ts) and commits them to main. Never RM5, never history.
#
#   1. TCGCSV → catalogue + TCGplayer US prices      (always)
#   2. Cardmarket → EU prices                        (repo variable POKEMON_CARDMARKET=1)
#   3. eBay Browse → cheapest matching listing       (EBAY_* secrets; capped, see below)
#   4. Commit data/pokemon to main (scripts/pokemon/publish-data.sh), in a
#      commit WITHOUT the deploy marker: the next daily release bundles it.
#      The 05:17 run lands before the morning Riftbound import that dispatches
#      that release, so the day's TCGplayer prices go out the same morning.
#
# Schedule and nothing else: no push trigger, so landing Pokémon code never
# starts an import (unlike refresh-prices.yml's importer paths). Once a day is
# what the data supports: TCGCSV and Cardmarket both publish daily.
#
# eBay QUOTA IS RIFTBOUND'S FIRST (one app, 5,000 Browse calls a day, and
# refresh-prices.yml uses most of it). Two runs:
#   05:17 UTC  catalogue and prices only, NO eBay: it sits just before the
#              Riftbound 07:00 run, the worst moment to spend shared quota;
#   21:47 UTC  the same import plus eBay, after both Riftbound runs (07:00 and
#              19:00, ~45 min each), spending at most POKEMON_EBAY_MAX_CALLS
#              (default 60) and only what sits above POKEMON_EBAY_RESERVE
#              (default 2,500: a full Riftbound run plus its own reserve). An
#              unknown count spends nothing (src/lib/pokemon/import.ts).
# A manual run searches eBay only when "with_ebay" is ticked.

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      with_ebay:
        description: "Also search eBay (still capped, and only above the reserve Riftbound needs)"
        type: boolean
        default: false

concurrency:
  group: pokemon-import
  cancel-in-progress: false

# contents: write lets the last step commit data/pokemon to main with the
# default GITHUB_TOKEN (a GITHUB_TOKEN push starts no other workflow and no
# Vercel build: the subject carries no deploy marker).
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Import
        id: import
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          # eBay only on the late schedule, or a manual run that asks for it.
          POKEMON_EBAY: ${{ ((github.event_name == 'schedule' && github.event.schedule == '47 21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.with_ebay)) && '1' || '0' }}
          POKEMON_EBAY_MAX_CALLS: ${{ vars.POKEMON_EBAY_MAX_CALLS }}
          POKEMON_EBAY_RESERVE: ${{ vars.POKEMON_EBAY_RESERVE }}
          POKEMON_CARDMARKET: ${{ vars.POKEMON_CARDMARKET }}
        run: npx tsx scripts/pokemon/import.ts

      # A failed publish fails the run: the files are the section's only copy.
      - name: Publish data/pokemon to main
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        run: bash scripts/pokemon/publish-data.sh "pokemon-import.yml (${{ github.event_name }}, run ${{ github.run_id }})"
