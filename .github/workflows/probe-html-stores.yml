name: probe-html-stores
on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-qu5ees]
    paths: [probe/candidates.json]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/probe-html-stores.ts probe/candidates.json 2>&1 | tee probe/rift-html-probe.log
      - run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add probe/ && git commit -m "probe: results" && git push origin HEAD:${{ github.ref_name }}
