name: TMP gsc page types
on:
  push:
    branches: [claude/project-thread-sscsu3]
    paths: [.github/workflows/tmp-gsc-page-types.yml, scripts/gsc-page-types.ts]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx -y tsx scripts/gsc-page-types.ts
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
