name: Marketplace maintenance

# Escrow enforcement for the P2P marketplace: releases abandoned checkout stock
# holds, auto-releases seller payouts past the buyer-confirm window, and
# auto-refunds orders a seller never shipped in time. Runs every 6h via GH
# Actions rather than Vercel Cron because Vercel's Hobby-plan cron only fires
# once a day — too coarse for windows measured in hours.
#
# SETUP (one-time): add a repository secret named CRON_SECRET matching the
# value already used to guard /api/revalidate and the other /api/cron/* routes.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: marketplace-maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run maintenance jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::No CRON_SECRET secret set — cannot call the maintenance endpoint."
            exit 1
          fi
          code=$(curl -s -o response.json -w "%{http_code}" --max-time 120 \
            "$SITE_URL/api/cron/marketplace-maintenance" -H "Authorization: Bearer $CRON_SECRET")
          echo "marketplace-maintenance -> HTTP ${code}"
          cat response.json || true
          [ "$code" = "200" ]
