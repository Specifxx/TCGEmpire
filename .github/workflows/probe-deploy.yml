name: Probe RiftCompare deploy state

# Read-only debugging aid: lists the repo's recent GitHub deployments (Vercel
# records one per deploy when the Git integration is connected) with their SHA
# + status, and fingerprints the live site so we can tell WHICH commit
# production is serving and whether new deploys are flowing.

#
# SPEED (2026-11-13): give `speed` a list of targets and this runs scripts/speed-ab.ts
# INSTEAD: Lighthouse with the deploy gate's settings on each target, several runs,
# the targets taking turns, then the browser's own list of largest paints. A target
# is `label=https://…` (an origin, or a full address with its own path):
#   speed: home=https://riftcompare.com browse=https://riftcompare.com/browse
# `label=sha:<commit>` (that commit's own production deployment) is accepted and
# reported, then left out: a deployment's own address is behind Vercel's sign-in,
# and a target that redirects to another host is not measured (DECISIONS.md, "The
# after-deploy gate was checking Vercel's sign-in page"). Read-only. See the
# script's header for why one run per deploy is not enough.

on:
  workflow_dispatch:
    inputs:
      speed:
        description: "Speed check instead of the deploy probe: targets as label=url, separated by spaces (public addresses only)"
        required: false
        default: ""
      runs:
        description: "Speed check: Lighthouse runs per target"
        required: false
        default: "5"
      page:
        description: "Speed check: the path to measure"
        required: false
        default: "/"
      methods:
        description: "Speed check: simulate (the gate's), devtools (really throttled), or both: simulate,devtools"
        required: false
        default: "simulate"

permissions:
  contents: read
  deployments: read

jobs:
  speed:
    if: inputs.speed != ''
    # Pinned for Playwright's Chromium, as seo-preview-gate.yml is.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Speed A/B (Lighthouse, the gate's settings, targets taking turns)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.speed }}
          RUNS: ${{ inputs.runs }}
          PAGE: ${{ inputs.page }}
          METHODS: ${{ inputs.methods }}
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          # $TARGETS is split on spaces on purpose: each word is one label=target.
          npx tsx scripts/speed-ab.ts --runs "$RUNS" --page "$PAGE" --methods "$METHODS" $TARGETS

  probe:
    if: inputs.speed == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recent Vercel deployments (via GitHub Deployments API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?per_page=10")
          echo "$DEPLOYS" | python3 -c '
          import json,sys
          ds = json.load(sys.stdin)
          if not ds:
              print("NO deployment records at all."); sys.exit(0)
          for d in ds:
              print(d["created_at"], "|", d["environment"], "|", d["sha"][:10], "|", d["statuses_url"])
          print("--- statuses of newest ---")
          import urllib.request
          req = urllib.request.Request(ds[0]["statuses_url"], headers={"Authorization":"Bearer '"$GH_TOKEN"'","User-Agent":"probe"})
          for s in json.load(urllib.request.urlopen(req)):
              print("status:", s["state"], s["created_at"], s.get("description",""))
          '

      - name: Fingerprint live site (riftcompare.com)
        run: |
          for p in / /sealed /browse /sitemap.xml /robots.txt; do
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 "https://riftcompare.com$p")
            ERR=$(grep -c "Application error\|server-side exception" /tmp/body || true)
            SIZE=$(wc -c < /tmp/body)
            echo "$CODE  err=$ERR  ${SIZE}B  $p"
          done
          echo "--- title ---"
          curl -fsSL --max-time 30 https://riftcompare.com/ | grep -o "<title>[^<]*</title>" | head -1 || true
