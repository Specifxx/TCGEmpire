name: Fetch TCG feed probe
on:
  push:
    branches: [claude/project-thread-j1qesk]
    paths: [scripts/fetchtcg-verify.ts, .github/workflows/fetchtcg-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/fetch-fetchtcg.ts && npx tsx scripts/fetchtcg-verify.ts
        env:
          FETCH_TCG_API_KEY: ${{ secrets.FETCH_TCG_API_KEY }}
