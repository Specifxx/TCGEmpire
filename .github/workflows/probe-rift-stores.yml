name: Probe Rift stores
# Research only (temporary, claude/* branches): sweeps each host in probe/rift-hosts.txt ("host MARKET") with
# scripts/sweep-registry.ts --only and commits the log to the branch. Read-only, no database.
on:
  push:
    branches: ["claude/**"]
    paths: ["probe/rift-hosts.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: |
          : > probe/rift-sweep.log
          while read -r host market; do
            [ -z "$host" ] && continue
            echo "===== $host ($market) =====" | tee -a probe/rift-sweep.log
            npx tsx scripts/sweep-registry.ts --only "$host" --markets "$market" --out "probe/sweep-$host.json" 2>&1 | tail -60 | tee -a probe/rift-sweep.log || true
          done < probe/rift-hosts.txt
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/rift-sweep.log probe/sweep-*.json
          git commit -m "probe: rift sweep results" || exit 0
          for i in 1 2 3 4; do git push origin HEAD:${GITHUB_REF_NAME} && exit 0; sleep $((2 ** i)); git pull --rebase origin ${GITHUB_REF_NAME}; done
          exit 1
