name: Arbitrage alerts

# Daily "Arbitrage Alerts" digest for Premium members — see
# src/lib/arbitrage-alerts.ts. Runs via GH Actions rather than Vercel Cron
# because this project's cron slots are already used by
# refresh-prices/price-alerts/newsletter/user-digest/discord-daily (same
# reason marketplace-maintenance.yml and premium-trial-reminders.yml exist).
#
# SETUP (one-time): add a repository secret named CRON_SECRET matching the
# value already used to guard /api/revalidate and the other /api/cron/* routes.

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: arbitrage-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send today's Arbitrage Alerts digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::No CRON_SECRET secret set — cannot call the cron endpoint."
            exit 1
          fi
          code=$(curl -s -o response.json -w "%{http_code}" --max-time 120 \
            "$SITE_URL/api/cron/arbitrage-alerts" -H "Authorization: Bearer $CRON_SECRET")
          echo "arbitrage-alerts -> HTTP ${code}"
          cat response.json || true
          [ "$code" = "200" ]
