name: Weekly promo pack

# Free, automated marketing: every week, generate a "price movers" digest from
# live data, auto-post it to the community Discord, and email a ready-to-paste
# Reddit post + X blurb to the site owner. See scripts/weekly-promo.ts.
#
# SETUP (one-time), Settings → Secrets and variables → Actions:
#   Secrets (DATABASE_URL should already exist for refresh-prices):
#     DATABASE_URL          Neon Postgres connection string
#     DISCORD_WEBHOOK_URL   Discord → channel → Integrations → Webhooks → New
#     RESEND_API_KEY        (optional) enables the promo-pack email
#     EMAIL_FROM            (optional) verified sender
#     PROMO_EMAIL           (optional) recipient; defaults to the site contact email
#   Variables (optional):
#     PROMO_MARKET          AU | US | UK — market the digest prices (default AU)

on:
  schedule:
    # Friday 20:30 UTC = Saturday 06:30 AEST — right after the Friday-evening
    # price refresh (19:00 UTC), so the digest uses the freshest prices and lands
    # at the top of the owner's Saturday-morning inbox, ready to post.
    - cron: "30 20 * * 5"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Print the generated content in the job log instead of posting/emailing"
        type: boolean
        default: false

concurrency:
  group: weekly-promo
  cancel-in-progress: false

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Generate and send promo pack
        env:
          DATABASE_URL: ${{ secrets.RM7 || vars.RM7 || secrets.RM8 || vars.RM8 || secrets.DATABASE_URL || vars.DATABASE_URL }}
          # Which of the chain above actually won, by NAME (never its value). lib/db.ts
          # cannot work this out inside Actions: the chain is collapsed into one
          # DATABASE_URL before the job starts, so process.env.RM5 is always unset there
          # and its warning always said "DATABASE_URL". See src/lib/db.ts.
          DB_SOURCE_NAME: ${{ (secrets.RM7 || vars.RM7) && 'RM7' || (secrets.RM8 || vars.RM8) && 'RM8' || 'DATABASE_URL' }}
          # The whole promo is built from price MOVERS, which come from
          # PriceHistory in the separate history project (src/lib/db-history.ts).
          # These were never set here, so that client fell through its entire
          # chain to DATABASE_URL — the OPERATIONAL database, whose PriceHistory
          # is deliberately empty since the RM3 cutover. The result was a promo
          # that skipped every Friday with "no price history yet".
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PROMO_EMAIL: ${{ secrets.PROMO_EMAIL }}
          PROMO_MARKET: ${{ vars.PROMO_MARKET }}
        run: npx tsx scripts/weekly-promo.ts ${{ inputs.dry_run && '--dry-run' || '' }}
