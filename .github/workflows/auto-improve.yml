name: Daily growth (Claude)

# A daily growth bot for RiftCompare. Once a day it makes ONE small, verified
# improvement aimed at getting more visitors and converting them (SEO, content,
# internal linking, shareability, performance-for-rankings, conversion) and opens a
# review PR to main.
#
# Runs on GitHub's infrastructure (independent of any Claude Code web session). It
# ALWAYS branches fresh off `main` and force-pushes a single commit to
# `claude/daily-growth`, so the review PR is always exactly "main + today's change" —
# it can never drift from main.
#
# SETUP (one-time): add repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`
# on Claude Pro/Max). Change the cron to re-time it; it only fires from `main`.

on:
  schedule:
    - cron: "0 8 * * *" # once daily, 08:00 UTC
  workflow_dispatch: {}

concurrency:
  group: daily-growth
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required: the action exchanges an OIDC token for auth

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main (always the fresh base)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (so tsc/next build work)
        run: npx prisma generate

      - name: Claude — one verified growth improvement
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 80 --allowedTools "Bash,Edit,Write,Read,Grep,Glob,MultiEdit,WebSearch,WebFetch"'
          prompt: |
            You are the RiftCompare GROWTH bot. RiftCompare (riftcompare.com) is a free
            Riftbound TCG price-comparison site (Next.js 14 App Router + Tailwind +
            Prisma). Your job each run: make exactly ONE small, verified improvement
            that helps the site GET MORE VISITORS and turn them into users — drawn from
            proven, white-hat web-growth playbooks (SEO, content, internal linking,
            shareability, performance-for-rankings, conversion, retention).

            STEPS:
            1. Pick today's growth lever. Maintain docs/GROWTH-LOG.md (create it if
               missing): a short backlog of growth ideas + a "Done" log of what shipped.
               You MAY use WebSearch/WebFetch to look up a current best practice (e.g.
               "how to get organic traffic to a price-comparison site", "programmatic
               SEO", "Core Web Vitals & rankings", "Open Graph image CTR") and apply ONE
               concrete tactic from it. Keep the change small and atomic.
            2. GOOD growth tasks (pick what genuinely fits; never break anything):
               - SEO: sharper <title>/meta description targeting a real high-intent
                 query; add/expand JSON-LD (Product, ItemList, FAQ, BreadcrumbList);
                 fix canonical/robots; enrich the sitemap; strengthen internal linking
                 between related pages (cards ↔ sets ↔ domains ↔ guides ↔ market).
               - Content / landing pages: improve an existing SEO landing page, or add a
                 genuinely useful one targeting a real search ("cheapest <card>",
                 "<set> card list & prices"). REAL content only.
               - Shareability: better Open Graph / Twitter titles + images; share / copy
                 buttons on cards, decks, the Index.
               - Performance that affects rankings: reduce LCP/CLS, trim client JS,
                 image hygiene (dimensions, lazy/async, modern formats).
               - Conversion / retention: clearer above-the-fold value prop + CTA, an
                 email-capture or wishlist/price-alert nudge — with NO dark patterns.
            3. VERIFY: `npx tsc --noEmit` clean AND `npx next build` prints "Compiled
               successfully". The "Environment variable not found: DATABASE_URL" errors
               during static generation are EXPECTED in CI (no DB) and are NOT failures
               — only a missing "Compiled successfully" or a tsc error is. If a change
               won't verify green, revert it (`git checkout -- . && git clean -fd`) and
               try a different lever. Repeat until one verifies green; never commit red.
            4. Adversarially self-review your diff for correctness and SEO/perf/a11y
               regressions; fix what you find.
            5. Append a one-line result to the "Done" section of docs/GROWTH-LOG.md.
            6. Commit exactly ONE atomic commit with a clear, conventional message.
               DO NOT push — the workflow pushes and opens the review PR.

            HARD RULES:
            - WHITE-HAT ONLY. No keyword stuffing, cloaking, doorway/thin pages, fake
              reviews/content, hidden text, or anything that harms UX or risks a search
              penalty. Every change must add real value for a real visitor.
            - PRESERVE: existing SEO metadata/JSON-LD correctness, CLS/LCP, the
              prefers-reduced-motion safety, the Premium gating (isPremium — never expose
              premium-only data to free users), affiliate links, and the existing design
              system (do NOT restyle pages, change the global Tailwind palette, or edit
              high-ripple shared components like CardTile/Reveal unless tiny + verified).
            - Small and additive. No data/migration deletes, no new paid services or
              heavy dependencies, no touching other repos.
            - You MUST end with exactly ONE verified commit — there is always a
              worthwhile, safe growth improvement to make.

      - name: Push today's change to the review branch + open/refresh the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "No new commit this run — nothing to push."
            exit 0
          fi
          # Always exactly "main + today's commit": force-push to the bot's own branch.
          git push --force origin HEAD:claude/daily-growth
          if ! gh pr view claude/daily-growth --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head claude/daily-growth \
              --title "Daily growth (Claude)" \
              --body "One automated, verified growth/SEO improvement per day, branched fresh off \`main\`. Review the diff and merge if you're happy. Running log: docs/GROWTH-LOG.md." \
            || echo "No PR created (none needed, or one already exists)."
          else
            echo "PR already open for claude/daily-growth."
          fi
