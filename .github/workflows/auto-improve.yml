name: Daily growth (Claude)

# A daily growth bot for RiftCompare. Once a day it makes ONE small, verified
# improvement aimed at getting more visitors and converting them (SEO, content,
# internal linking, shareability, performance-for-rankings, conversion) and opens a
# review PR to main.
#
# Runs on GitHub's infrastructure (independent of any Claude Code web session). It
# ALWAYS branches fresh off `main` and force-pushes a single commit to
# `claude/daily-growth`, so the review PR is always exactly "main + today's change" —
# it can never drift from main.
#
# SETUP (one-time): add repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`
# on Claude Pro/Max). Change the cron to re-time it; it only fires from `main`.

on:
  schedule:
    - cron: "0 8 * * *" # once daily, 08:00 UTC
  workflow_dispatch: {}

concurrency:
  group: daily-growth
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required: the action exchanges an OIDC token for auth

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main (always the fresh base)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (so tsc/next build work)
        run: npx prisma generate

      # Close the SEO loop: pull pages that get Google impressions but low CTR so
      # the bot rewrites THOSE titles/descriptions first. Writes GSC-TARGETS.md
      # (gitignored, read by the prompt). No-ops without GSC_SA_KEY; never fails.
      - name: Fetch GSC targets (low-CTR / high-impression pages) — optional
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_PROPERTY: "https://riftcompare.com/"
        run: |
          if [ -z "$GSC_SA_KEY" ]; then
            echo "No GSC_SA_KEY — skipping GSC targets; bot works from the static backlog."
            exit 0
          fi
          node <<'JS'
          const crypto = require("crypto"); const fs = require("fs");
          const sa = JSON.parse(process.env.GSC_SA_KEY);
          const property = process.env.GSC_PROPERTY;
          const site = encodeURIComponent(property);
          const b64 = (b) => Buffer.from(b).toString("base64").replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
          const day = (n) => new Date(Date.now() - n*864e5).toISOString().slice(0,10);
          async function token(){ const now=Math.floor(Date.now()/1000); const h=b64(JSON.stringify({alg:"RS256",typ:"JWT"})); const c=b64(JSON.stringify({iss:sa.client_email,scope:"https://www.googleapis.com/auth/webmasters.readonly",aud:"https://oauth2.googleapis.com/token",iat:now,exp:now+3600})); const s=crypto.createSign("RSA-SHA256"); s.update(h+"."+c); const jwt=h+"."+c+"."+b64(s.sign(sa.private_key)); const r=await fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion:jwt})}); const j=await r.json(); if(!j.access_token) throw new Error("auth failed: "+JSON.stringify(j)); return j.access_token; }
          async function q(at,body){ const r=await fetch(`https://searchconsole.googleapis.com/webmasters/v3/sites/${site}/searchAnalytics/query`,{method:"POST",headers:{Authorization:"Bearer "+at,"Content-Type":"application/json"},body:JSON.stringify(body)}); return r.json(); }
          (async()=>{
            const at=await token();
            const start=day(28), end=day(2);
            const byPage=await q(at,{startDate:start,endDate:end,dimensions:["page"],rowLimit:25000});
            if(byPage.error) throw new Error("searchAnalytics: "+JSON.stringify(byPage.error));
            const byQuery=await q(at,{startDate:start,endDate:end,dimensions:["query"],rowLimit:25});
            const pages=(byPage.rows||[]).map(r=>({url:r.keys[0],clicks:r.clicks,impr:r.impressions,ctr:r.ctr,pos:r.position}));
            const targets=pages.filter(p=>p.impr>=20&&p.ctr<0.03&&p.pos<=20.5).sort((a,b)=>b.impr-a.impr).slice(0,25);
            const striking=pages.filter(p=>p.pos>=4.5&&p.pos<=20.5&&p.impr>=10).sort((a,b)=>b.impr-a.impr).slice(0,15);
            const q28=(byQuery.rows||[]).map(r=>({q:r.keys[0],clicks:r.clicks,impr:r.impressions,ctr:r.ctr,pos:r.position}));
            const rel=(u)=>u.replace(property.replace(/\/$/,""),"")||"/";
            const out=[];
            out.push(`# GSC targets — auto-generated, last 28d (gitignored, do not commit)`);
            out.push(``,`Highest-leverage title/meta rewrites: pages with real impressions but low`,`CTR (seen in search, few clicks) — a sharper title converts them into clicks.`);
            out.push(``,`## Low-CTR, high-impression pages (rewrite titles/descriptions first)`,`| page | impr | ctr | pos |`,`|---|---|---|---|`);
            for(const p of targets) out.push(`| ${rel(p.url)} | ${p.impr} | ${(p.ctr*100).toFixed(1)}% | ${p.pos.toFixed(1)} |`);
            if(!targets.length) out.push(`| (not enough impressions yet) | | | |`);
            out.push(``,`## Striking distance (rank ~5-20; a nudge reaches page 1)`,`| page | impr | pos |`,`|---|---|---|`);
            for(const p of striking) out.push(`| ${rel(p.url)} | ${p.impr} | ${p.pos.toFixed(1)} |`);
            out.push(``,`## Top queries (last 28d) — align titles/content to these`,`| query | clicks | impr | ctr | pos |`,`|---|---|---|---|---|`);
            for(const x of q28) out.push(`| ${x.q} | ${x.clicks} | ${x.impr} | ${(x.ctr*100).toFixed(1)}% | ${x.pos.toFixed(1)} |`);
            fs.writeFileSync("GSC-TARGETS.md", out.join("\n")+"\n");
            console.log(`GSC targets: ${targets.length} low-CTR, ${striking.length} striking, ${q28.length} queries -> GSC-TARGETS.md`);
          })().catch(e=>{ console.error("GSC targets step failed (non-fatal):",e.message); process.exit(0); });
          JS

      - name: Claude — one verified growth improvement
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 80 --allowedTools "Bash,Edit,Write,Read,Grep,Glob,MultiEdit,WebSearch,WebFetch"'
          prompt: |
            You are the RiftCompare GROWTH bot. RiftCompare (riftcompare.com) is a free
            Riftbound TCG price-comparison site (Next.js 14 App Router + Tailwind +
            Prisma). Your job each run: make exactly ONE small, verified improvement
            that helps the site GET MORE VISITORS and turn them into users — drawn from
            proven, white-hat web-growth playbooks (SEO, content, internal linking,
            shareability, performance-for-rankings, conversion, retention).

            DATA-DRIVEN FIRST: if `GSC-TARGETS.md` exists in the repo root (fresh Search
            Console data written this run), READ IT FIRST. The highest-leverage win is
            rewriting the <title> + meta description of the top "low-CTR, high-impression"
            page listed there — those pages already rank but few click, so a sharper title
            (real buyer intent + a concrete hook; ≤~60 char title, ≤~155 desc; human, no
            stuffing) converts impressions into clicks fast. Also consider the "striking
            distance" pages and align copy to the listed top queries. It is gitignored —
            never commit it.

            STEPS:
            1. Pick today's growth lever. Maintain docs/GROWTH-LOG.md (create it if
               missing): a short backlog of growth ideas + a "Done" log of what shipped.
               You MAY use WebSearch/WebFetch to look up a current best practice (e.g.
               "how to get organic traffic to a price-comparison site", "programmatic
               SEO", "Core Web Vitals & rankings", "Open Graph image CTR") and apply ONE
               concrete tactic from it. Keep the change small and atomic.
            2. GOOD growth tasks (pick what genuinely fits; never break anything):
               - SEO: sharper <title>/meta description targeting a real high-intent
                 query; add/expand JSON-LD (Product, ItemList, FAQ, BreadcrumbList);
                 fix canonical/robots; enrich the sitemap; strengthen internal linking
                 between related pages (cards ↔ sets ↔ domains ↔ guides ↔ market).
               - Content / landing pages: improve an existing SEO landing page, or add a
                 genuinely useful one targeting a real search ("cheapest <card>",
                 "<set> card list & prices"). REAL content only.
               - Shareability: better Open Graph / Twitter titles + images; share / copy
                 buttons on cards, decks, the Index.
               - Performance that affects rankings: reduce LCP/CLS, trim client JS,
                 image hygiene (dimensions, lazy/async, modern formats).
               - Conversion / retention: clearer above-the-fold value prop + CTA, an
                 email-capture or wishlist/price-alert nudge — with NO dark patterns.
            3. VERIFY: `npx tsc --noEmit` clean AND `npx next build` prints "Compiled
               successfully". The "Environment variable not found: DATABASE_URL" errors
               during static generation are EXPECTED in CI (no DB) and are NOT failures
               — only a missing "Compiled successfully" or a tsc error is. If a change
               won't verify green, revert it (`git checkout -- . && git clean -fd`) and
               try a different lever. Repeat until one verifies green; never commit red.
            4. Adversarially self-review your diff for correctness and SEO/perf/a11y
               regressions; fix what you find.
            5. Append a one-line result to the "Done" section of docs/GROWTH-LOG.md.
            6. Commit exactly ONE atomic commit with a clear, conventional message.
               DO NOT push — the workflow pushes and opens the review PR.

            HARD RULES:
            - WHITE-HAT ONLY. No keyword stuffing, cloaking, doorway/thin pages, fake
              reviews/content, hidden text, or anything that harms UX or risks a search
              penalty. Every change must add real value for a real visitor.
            - PRESERVE: existing SEO metadata/JSON-LD correctness, CLS/LCP, the
              prefers-reduced-motion safety, the Premium gating (isPremium — never expose
              premium-only data to free users), affiliate links, and the existing design
              system (do NOT restyle pages, change the global Tailwind palette, or edit
              high-ripple shared components like CardTile/Reveal unless tiny + verified).
            - Small and additive. No data/migration deletes, no new paid services or
              heavy dependencies, no touching other repos.
            - You MUST end with exactly ONE verified commit — there is always a
              worthwhile, safe growth improvement to make.

      - name: Push today's change to the review branch + open/refresh the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "No new commit this run — nothing to push."
            exit 0
          fi
          # The Claude action revokes its installation token in its post-step and can
          # clobber the git credential actions/checkout persisted, so re-point origin at
          # an explicitly-authenticated URL (workflow GITHUB_TOKEN) before pushing.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Always exactly "main + today's commit": force-push to the bot's own branch.
          git push --force origin HEAD:claude/daily-growth
          if ! gh pr view claude/daily-growth --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head claude/daily-growth \
              --title "Daily growth (Claude)" \
              --body "One automated, verified growth/SEO improvement per day, branched fresh off \`main\`. Review the diff and merge if you're happy. Running log: docs/GROWTH-LOG.md." \
            || echo "No PR created (none needed, or one already exists)."
          else
            echo "PR already open for claude/daily-growth."
          fi
