name: Refresh prices

# Keeps store prices up to date by running the importer against the production
# database on a schedule. Runs on GitHub's servers (no serverless time limit).
#
# SETUP (one-time): add a repository secret named DATABASE_URL with your Neon
# Postgres connection string — Settings → Secrets and variables → Actions.

on:
  schedule:
    # Twice daily (UTC): 07:00 ≈ 5pm AEST, 19:00 ≈ 5am AEST. Store prices refresh on
    # both runs; eBay is gated to ONCE per day (it covers every card, ~950 calls,
    # well under eBay's ~5,000/day Browse API limit). The 20h gate in price-import.ts
    # means only the first run each day actually calls eBay.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      ebay_force:
        description: "Force an eBay refresh even if it ran in the last 20h"
        type: boolean
        default: false
  # Re-import (and recompute stored prices) whenever price/matching logic changes.
  push:
    branches: [main]
    paths:
      - "src/lib/ebay.ts"
      - "src/lib/price-import.ts"
      - "src/lib/retailers.ts"
      - "src/lib/tcgplayer.ts"
      - "src/lib/cardmarket.ts"
      - "src/lib/sealed-import.ts"
      - "scripts/import-prices.ts"
      - "scripts/import-sealed.ts"

# Never run two price imports at once (they both write to the same DB).
concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Import prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL }}
          # eBay is optional — the import skips it if these aren't set.
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
          # Deploys (push to main) also trigger this workflow to recompute store
          # prices, but must NOT spend eBay quota. Only scheduled / manual runs are
          # allowed to call eBay, so frequent deploys can never add to the daily count.
          EBAY_REFRESH: ${{ github.event_name != 'push' }}
          # Manual run with "ebay_force" ticked bypasses the once-a-day eBay gate.
          EBAY_FORCE: ${{ inputs.ebay_force && '1' || '' }}
          # RH5 is the current history project (see src/lib/db-history.ts) — _4 went
          # unreachable (P1001) and is kept only as a dead fallback.
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
        run: npx tsx scripts/import-prices.ts
      - name: Import sealed products
        # Populate the /sealed page (booster boxes/packs across AU/NZ/US). Nothing
        # else scheduled this before, so the table went empty.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
          EBAY_REFRESH: ${{ github.event_name != 'push' }}
          EBAY_FORCE: ${{ inputs.ebay_force && '1' || '' }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
        run: npx tsx scripts/import-sealed.ts

      - name: Revalidate site pages (on-demand ISR)
        # New prices just landed, so regenerate the ISR pages NOW. This is what lets
        # the public pages carry a 24h revalidate fallback instead of re-querying
        # Neon on a short timer — the fix for the DB's public-transfer allowance.
        # Reuses CRON_SECRET (the existing cron token). Add it as an Actions secret;
        # a missing/failed ping is non-fatal (pages just fall back to the 24h TTL).
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "No CRON_SECRET secret — skipping revalidation (pages fall back to their 24h TTL)."
            exit 0
          fi
          # `|| true` so a connection error / timeout (curl exit ≠ 0) can't fail the
          # step under `set -eo pipefail` — a failed ping must never red a successful
          # import; pages just fall back to their 24h TTL.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST \
            "$SITE_URL/api/revalidate" -H "Authorization: Bearer $CRON_SECRET" || true)
          echo "revalidate -> HTTP ${code:-000}"
          [ "$code" = "200" ] || echo "Non-200/failed (pages still refresh on their 24h TTL); not failing the run."
