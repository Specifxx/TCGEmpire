name: Refresh prices

# Keeps store prices up to date by running the importer against the production
# database on a schedule. Runs on GitHub's servers (no serverless time limit).
#
# SETUP (one-time): add a repository secret named DATABASE_URL with your Neon
# Postgres connection string — Settings → Secrets and variables → Actions.

on:
  schedule:
    # Twice daily (UTC): 07:00 ≈ 5pm AEST, 19:00 ≈ 5am AEST. Store prices refresh on
    # both runs. eBay is NOT once a day, despite what this comment used to claim:
    # the 07:00 run does the full catalogue across all four markets, and the 19:00
    # run does the promo/signature/overnumbered chase set (a 20h gate keeps the
    # full pass to one a day, a 10h gate lets the chase pass run in between).
    # The sealed search follows BOTH runs. Roughly 2,850 Browse calls a day all
    # told (the chase-auction pass was removed on 2026-08-20, returning ~960
    # calls/day), against eBay's 5,000/day limit less a 600 reserve —
    # tests/affiliate-priority.test.ts models the whole day and fails if it stops
    # fitting.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      ebay_force:
        description: "Force an eBay refresh even if it ran in the last 20h"
        type: boolean
        default: false
  # Re-import (and recompute stored prices) whenever price/matching logic changes.
  push:
    branches: [main]
    paths:
      - "src/lib/ebay.ts"
      - "src/lib/price-import.ts"
      - "src/lib/retailers.ts"
      - "src/lib/tcgplayer.ts"
      - "src/lib/cardmarket.ts"
      - "src/lib/cardtrader.ts"
      - "src/lib/sealed-import.ts"
      - "scripts/import-prices.ts"
      - "scripts/import-sealed.ts"

# Never run two price imports at once (they both write to the same DB).
concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 90, not 55: the 55-minute limit KILLED the 2026-08-03 run 9 minutes into
    # its third eBay market, discarding that market's work entirely. At the
    # measured ~0.75s/card worst case, a run is ~18 min of store imports plus
    # ~52 min for three eBay markets over a 1,400-card catalogue — about 70
    # minutes, with 90 leaving real headroom for a slow store or an eBay backoff.
    # tests/affiliate-priority.test.ts reads this number and fails if the market
    # rotation grows past what it allows.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Sync the schema BEFORE importing. This workflow is triggered by pushes to
      # main touching price-import.ts / retailers.ts / etc, so it runs the NEW code
      # — but nothing here used to touch the database schema. Schema only reached
      # the DB via a Vercel build (scripts/build-db-push.sh, which no-ops outside
      # Vercel) or a manual maintenance.yml db-push. So a commit that added a column
      # and touched a watched path would run new code against an un-migrated
      # database and die with P2022 "column does not exist" — which is exactly how
      # the CA market launch broke this job (Card.lowestPriceCentsCa).
      #
      # NOTE: deliberately no --accept-data-loss here (unlike the Vercel build and
      # the manual maintenance job). Additive changes apply automatically; anything
      # destructive stops the run instead of quietly dropping a column on a
      # schedule. Do those by hand via maintenance.yml's db-push task.
      - name: Sync database schema (additive)
        env:
          DATABASE_URL: ${{ secrets.RM7 || vars.RM7 }}
          # RM7 is the only operational variable now (2026-09-05 cutover — see
          # src/lib/db-chains.ts). This is set explicitly rather than left to
          # lib/db.ts's own resolution because Actions collapses everything into
          # one DATABASE_URL before the job starts, so process.env-based
          # resolution can't see which secret actually won. See src/lib/db.ts.
          DB_SOURCE_NAME: ${{ (secrets.RM7 || vars.RM7) && 'RM7' || 'UNSET' }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::No database URL configured — cannot sync schema."
            exit 1
          fi
          if ! npx prisma db push --skip-generate; then
            echo "::error::prisma db push failed. If this is a DESTRUCTIVE change (dropping a column/table), \
          run the db-push task in maintenance.yml by hand (it passes --accept-data-loss). \
          Not applying it automatically here on purpose."
            exit 1
          fi
      - name: Import prices
        env:
          DATABASE_URL: ${{ secrets.RM7 || vars.RM7 }}
          # RM7 is the only operational variable now (2026-09-05 cutover — see
          # src/lib/db-chains.ts). This is set explicitly rather than left to
          # lib/db.ts's own resolution because Actions collapses everything into
          # one DATABASE_URL before the job starts, so process.env-based
          # resolution can't see which secret actually won. See src/lib/db.ts.
          DB_SOURCE_NAME: ${{ (secrets.RM7 || vars.RM7) && 'RM7' || 'UNSET' }}
          # eBay is optional — the import skips it if these aren't set.
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
          # Deploys (push to main) also trigger this workflow to recompute store
          # prices, but must NOT spend eBay quota. Only scheduled / manual runs are
          # allowed to call eBay, so frequent deploys can never add to the daily count.
          EBAY_REFRESH: ${{ github.event_name != 'push' }}
          # Manual run with "ebay_force" ticked bypasses the once-a-day eBay gate.
          EBAY_FORCE: ${{ inputs.ebay_force && '1' || '' }}
          # EU price sources. CardTrader needs its token (previously missing from
          # this step entirely, which meant it silently never ran on the schedule
          # even once CARDTRADER_API_TOKEN was set as a repo secret — Actions only
          # exposes a secret to a step that names it here). Cardmarket needs NO
          # secret at all — it fetches its own public data with zero config — so
          # every CARDMARKET_* var here is an optional override, not a requirement.
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          CARDMARKET_DISABLED: ${{ vars.CARDMARKET_DISABLED }}
          CARDMARKET_PRODUCTLIST_URL: ${{ vars.CARDMARKET_PRODUCTLIST_URL }}
          CARDMARKET_PRODUCTLIST_NONSINGLES_URL: ${{ vars.CARDMARKET_PRODUCTLIST_NONSINGLES_URL }}
          CARDMARKET_PRICEGUIDE_URL: ${{ vars.CARDMARKET_PRICEGUIDE_URL }}
          CARDMARKET_EUR_TO_GBP: ${{ vars.CARDMARKET_EUR_TO_GBP }}
          # RH8 is the current history project (see src/lib/db-history.ts) — RH6 is
          # its rollback, and everything older is a dead fallback kept only
          # so a drain can still reach it. THIS STEP WRITES PriceHistory — if RH8 is
          # missing here, db-history.ts falls through to RH6 (or, at the end of the
          # chain, to the OPERATIONAL database), so keep this list in sync with
          # db-history.ts / db-chains.ts.
          RH11: ${{ secrets.RH11 || vars.RH11 }}
          RH10: ${{ secrets.RH10 || vars.RH10 }}
          RH9: ${{ secrets.RH9 || vars.RH9 }}
          RH8: ${{ secrets.RH8 || vars.RH8 }}
          RH7: ${{ secrets.RH7 || vars.RH7 }}
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
        run: npx tsx scripts/import-prices.ts
      - name: Import sealed products
        # Populate the /sealed page (booster boxes/packs across AU/US). Nothing
        # else scheduled this before, so the table went empty.
        env:
          DATABASE_URL: ${{ secrets.RM7 || vars.RM7 }}
          # RM7 is the only operational variable now (2026-09-05 cutover — see
          # src/lib/db-chains.ts). This is set explicitly rather than left to
          # lib/db.ts's own resolution because Actions collapses everything into
          # one DATABASE_URL before the job starts, so process.env-based
          # resolution can't see which secret actually won. See src/lib/db.ts.
          DB_SOURCE_NAME: ${{ (secrets.RM7 || vars.RM7) && 'RM7' || 'UNSET' }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
          EBAY_REFRESH: ${{ github.event_name != 'push' }}
          EBAY_FORCE: ${{ inputs.ebay_force && '1' || '' }}
          # Cardmarket sealed (EU) — zero-config like its singles pass above; see
          # that step's comment. Optional overrides only.
          CARDMARKET_DISABLED: ${{ vars.CARDMARKET_DISABLED }}
          CARDMARKET_PRODUCTLIST_URL: ${{ vars.CARDMARKET_PRODUCTLIST_URL }}
          CARDMARKET_PRODUCTLIST_NONSINGLES_URL: ${{ vars.CARDMARKET_PRODUCTLIST_NONSINGLES_URL }}
          CARDMARKET_PRICEGUIDE_URL: ${{ vars.CARDMARKET_PRICEGUIDE_URL }}
          # Same chain as the Import prices step above — see its comment.
          RH11: ${{ secrets.RH11 || vars.RH11 }}
          RH10: ${{ secrets.RH10 || vars.RH10 }}
          RH9: ${{ secrets.RH9 || vars.RH9 }}
          RH8: ${{ secrets.RH8 || vars.RH8 }}
          RH7: ${{ secrets.RH7 || vars.RH7 }}
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
        run: npx tsx scripts/import-sealed.ts

      - name: Revalidate site pages (on-demand ISR)
        # New prices just landed, so regenerate the ISR pages NOW. This is what lets
        # the public pages carry a 24h revalidate fallback instead of re-querying
        # Neon on a short timer — the fix for the DB's public-transfer allowance.
        # Reuses CRON_SECRET (the existing cron token). Add it as an Actions secret;
        # a missing/failed ping is non-fatal (pages just fall back to the 24h TTL).
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "No CRON_SECRET secret — skipping revalidation (pages fall back to their 24h TTL)."
            exit 0
          fi
          # `|| true` so a connection error / timeout (curl exit ≠ 0) can't fail the
          # step under `set -eo pipefail` — a failed ping must never red a successful
          # import; pages just fall back to their 24h TTL.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST \
            "$SITE_URL/api/revalidate" -H "Authorization: Bearer $CRON_SECRET" || true)
          echo "revalidate -> HTTP ${code:-000}"
          [ "$code" = "200" ] || echo "Non-200/failed (pages still refresh on their 24h TTL); not failing the run."
