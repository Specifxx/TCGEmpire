name: Refresh prices

# Keeps store prices up to date by running the importer against the production
# database on a schedule. Runs on GitHub's servers (no serverless time limit).
#
# SETUP (one-time): add a repository secret named DATABASE_URL with your Neon
# Postgres connection string — Settings → Secrets and variables → Actions.

on:
  schedule:
    # Twice daily (UTC): 07:00 ≈ 5pm AEST, 19:00 ≈ 5am AEST. Two refreshes/day keeps
    # eBay well within its ~5,000 calls/day Browse API limit (2 x 500 = 1,000) and
    # stays light on the GitHub Actions budget.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {} # allows a manual "Run workflow" button
  # Re-import (and recompute stored prices) whenever price/matching logic changes.
  push:
    branches: [main]
    paths:
      - "src/lib/ebay.ts"
      - "src/lib/price-import.ts"
      - "src/lib/retailers.ts"
      - "scripts/import-prices.ts"

# Never run two price imports at once (they both write to the same DB).
concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Import prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # eBay is optional — the import skips it if these aren't set.
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
        run: npx tsx scripts/import-prices.ts
