name: Price-drop email

# Triggers the one-off PRICE-DROP announcement (2026-09-27) to every account
# that is not currently paying: free accounts, lapsed subscribers and cancelled
# trialists. It states the new prices (Premium and Plus, monthly and "…/mo
# billed yearly", all read from src/lib/site.ts) with four subscribe links that
# open checkout for that exact tier and plan. See src/lib/premium-offer.ts for
# the audience and src/lib/email.ts (buildPremiumOfferEmail) for the wording.
# Until 2026-09-27 this workflow sent the "a full month of Premium, on us"
# offer; the file name and endpoint path are unchanged.
#
# THE EASIER WAY: the admin console at https://riftcompare.com/admin/premium-offer
# shows the reach (audience, sent, remaining, opted out), sends a test to one
# inbox, and sends the batches from a button. This workflow is the CI path to
# the same lib.
#
# THE SEND HAPPENS ON VERCEL, NOT HERE. The mail keys (BREVO_API_KEY /
# RESEND_API_KEY) are Vercel environment variables; a GitHub runner has the
# database but not the keys, so this job only authenticates a call to
# /api/cron/premium-offer with CRON_SECRET — the same split
# release-day-email.yml uses.
#
# SAFETY: manual dispatch only (no schedule) and dry_run defaults to TRUE, so
# the Run-workflow button cannot blast by accident. The endpoint is idempotent
# per account (User.priceDropEmailSentAt, stamped on success), so re-running
# RESUMES rather than double-sending — which is also how you work through an
# audience larger than one run's batch (90 by default, under Brevo's 300/day
# free cap): run it again each day until `remaining` is 0.
#
# HOW TO RUN: 1) Run workflow with dry_run ticked — read `pending` in the log.
# 2) Send yourself a test from the admin console. 3) Run workflow with dry_run
# unticked, once a day, until `remaining` is 0.
#
# AFTER IT SENDS: /admin/premium lists anyone who followed a link (source
# "price-drop-email"), and scripts/funnel-report.ts counts their checkouts under
# the "price-drop-email" surface.
#
# SETUP: CRON_SECRET as an Actions secret (already used by refresh-prices.yml).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — report the audience, send NOTHING (untick to actually send)"
        type: boolean
        default: true
      via:
        description: "Mail provider (Brevo protects the Resend quota transactional email depends on)"
        type: choice
        required: true
        default: "brevo"
        options:
          - brevo
          - resend
      limit:
        description: "Max emails this run (blank = default batch of 90; capped at 300, Brevo's daily free limit; re-run next day to continue)"
        type: string
        required: false
        default: ""

concurrency:
  # Never let two blasts overlap — that is how people get double-emailed.
  group: premium-offer-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger the price-drop email on Vercel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
          # dry=1 unless the box was explicitly unticked.
          DRY: ${{ inputs.dry_run && '1' || '0' }}
          VIA: ${{ inputs.via }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::No CRON_SECRET secret set — cannot authenticate the trigger."
            exit 1
          fi
          url="$SITE_URL/api/cron/premium-offer?dry=$DRY&via=$VIA"
          [ -n "$LIMIT" ] && url="$url&limit=$LIMIT"
          echo "POST $url"
          code=$(curl -sS --max-time 290 -o response.json -w "%{http_code}" -X POST \
            "$url" -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat response.json
          echo
          # Fail the job on a non-200 so a silent no-send is visible in the UI.
          [ "$code" = "200" ] || { echo "::error::Price-drop endpoint returned $code"; exit 1; }
