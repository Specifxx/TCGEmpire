name: Premium trial reminders

# Warns Premium free-trial users before their card is charged: runs daily and emails
# anyone whose trial converts to paid within the next 24h. Runs via GH Actions rather
# than Vercel Cron because this project's cron slots are already used by
# refresh-prices/price-alerts/newsletter/user-digest/discord-daily (same reason
# marketplace-maintenance.yml exists) — see src/lib/premium.ts's
# runPremiumTrialReminders for why this can't just be Stripe's own
# customer.subscription.trial_will_end webhook (it doesn't fire for trials this short).
#
# SETUP (one-time): add a repository secret named CRON_SECRET matching the value
# already used to guard /api/revalidate and the other /api/cron/* routes.

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: premium-trial-reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send due trial-ending reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::No CRON_SECRET secret set — cannot call the cron endpoint."
            exit 1
          fi
          code=$(curl -s -o response.json -w "%{http_code}" --max-time 90 \
            "$SITE_URL/api/cron/premium-trial-reminders" -H "Authorization: Bearer $CRON_SECRET")
          echo "premium-trial-reminders -> HTTP ${code}"
          cat response.json || true
          [ "$code" = "200" ]
