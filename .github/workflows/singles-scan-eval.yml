# TCG Singles DB card scanner: image coverage and accuracy (scripts/scan-eval/singles.ts; DECISIONS.md 2026-11-20).
# About 2,250 small Haiku 5.5 reads (150 cards x 5 photo conditions x 3 games): roughly US$0.70 a run. Results go to the scan-eval-results branch and the run's artifact.
name: Singles scan eval
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/scan-eval/singles.ts", "scripts/scan-eval/singles-trigger.txt", ".github/workflows/singles-scan-eval.yml"]
permissions:
  contents: write
concurrency:
  group: singles-scan-eval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Specifxx/tcgsinglesdb
          ref: claude/project-thread-vu08t7
          path: tcgsinglesdb
          sparse-checkout: |
            src/lib/scan
            data/cards/pokemon/search.json
            data/cards/pokemon/sets.json
            data/cards/yugioh/search.json
            data/cards/yugioh/sets.json
            data/cards/one-piece/search.json
            data/cards/one-piece/sets.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm rebuild sharp
      - run: npx tsx scripts/scan-eval/singles.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SCAM_AI_KEY }}
          SINGLES_DIR: tcgsinglesdb
          EVAL_CARDS: "150"
      - run: cat scripts/scan-eval/results-singles/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-singles
          path: scripts/scan-eval/results-singles
          retention-days: 30
      # Results never go back to the triggering branch: threads share claude/* branches, and a results commit there
      # rode into unrelated pull requests (DECISIONS.md 2026-11-26 "Stray files stay out of pull requests").
      # They go to the `scan-eval-results` branch (never merged, never deployed), one folder per eval.
      - name: Publish results to the scan-eval-results branch
        if: always()
        env:
          SRC: scripts/scan-eval/results-singles
          DEST: results-singles
        run: |
          [ -d "$SRC" ] || exit 0
          pub="$RUNNER_TEMP/pub"
          for i in 1 2 3 4; do
            cd "$GITHUB_WORKSPACE"; rm -rf "$pub"; git worktree prune
            if git fetch -q --depth 1 origin scan-eval-results; then git worktree add -q --detach "$pub" FETCH_HEAD; else git worktree add -q --orphan "$pub"; fi
            rm -rf "$pub/$DEST" && cp -r "$SRC" "$pub/$DEST"
            cd "$pub" && git add -A "$DEST"
            git -c user.name=scan-eval -c user.email=scan-eval@users.noreply.github.com commit -qm "Singles scan eval results ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})" || exit 0
            git push -q origin HEAD:refs/heads/scan-eval-results && exit 0
            sleep $((i * 5))
          done
          exit 1
