name: DB audit

# On-demand card-database integrity audit (scripts/db-audit.ts): identity/search
# index, duplicates, taxonomy, price consistency, zombie listings, freshness.
# Read-only unless "fix" is ticked (which repairs only missing slugs + broken
# search indexes — the two safe derived fields).

on:
  workflow_dispatch:
    inputs:
      fix:
        description: "Apply safe fixes (backfill missing slugs, recompute search index)"
        type: boolean
        default: false
  # Also run (read-only) when the audit itself changes — and because the
  # workflow_dispatch API can't see a workflow until it exists on the default
  # branch, this is what lets the audit run from a feature branch at all.
  push:
    paths:
      - "scripts/db-audit.ts"
      - ".github/workflows/db-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run audit
        env:
          DATABASE_URL: ${{ secrets.RM7 || vars.RM7 || secrets.RM8 || vars.RM8 || secrets.DATABASE_URL || vars.DATABASE_URL }}
          # Which of the chain above actually won, by NAME (never its value). lib/db.ts
          # cannot work this out inside Actions: the chain is collapsed into one
          # DATABASE_URL before the job starts, so process.env.RM5 is always unset there
          # and its warning always said "DATABASE_URL". See src/lib/db.ts.
          DB_SOURCE_NAME: ${{ (secrets.RM7 || vars.RM7) && 'RM7' || (secrets.RM8 || vars.RM8) && 'RM8' || 'DATABASE_URL' }}
          # The audit's Freshness section reads PriceHistory, which lives in the
          # separate history project (src/lib/db-history.ts). Without these, that
          # client falls all the way through its chain to DATABASE_URL — the
          # OPERATIONAL database, whose PriceHistory is deliberately empty — and
          # the audit reports a false "PriceHistory is EMPTY".
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
        run: npx tsx scripts/db-audit.ts ${{ inputs.fix && '--fix' || '' }}
