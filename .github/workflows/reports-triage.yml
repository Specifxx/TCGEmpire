# Daily triage of visitor reports from every Compare Empire site
# (scripts/reports-triage.mjs). Each site saves "wrong price" and "suggest a
# store" reports on the `reports` branch of its own public repo; this job reads
# all twelve, keeps one issue per site here with what is open and what needs a
# look, comments once a day on "Reports digest" when new reports arrive, and
# fails (GitHub emails the owner) when the sites' write token stops working or
# expires within 14 days, or a site has no reports branch.
name: Reports triage
on:
  schedule:
    - cron: "17 21 * * *" # 07:17 AEST / 08:17 AEDT, before the day starts in Australia
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: reports-triage
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/reports-triage.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORTS_GITHUB_TOKEN: ${{ secrets.REPORTS_GITHUB_TOKEN }}
