name: Maintenance

# On-demand maintenance tasks against the production database — dispatchable so
# routine data operations (schema push, card syncs, the Vendetta spoiler pipeline)
# can run without a local dev environment. Each task maps to a scripts/*.ts entry;
# they are all ADDITIVE/idempotent (see each script's header).

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        type: choice
        required: true
        options:
          - db-push          # prisma db push (additive schema sync for this ref)
          - cards-sync       # fetch latest RiftScribe snapshot + additive upsert
          - cards-manual     # apply prisma/manual-cards.json (promos/backstop)
          - fetch-promos     # scrape riftbound.gg's official card-page sitemap for promo printings (incl. R-numbered promo runes) + apply additively (no dry-run — both scripts are additive/idempotent by design)
          - tcg-printings    # create printings TCGplayer lists that we lack (Showcase/alt-art variants + the R-numbered rune cycle)
          - fix-cloned-art   # scrape real official art for cloned promo/rune printings; clear wrong borrowed art to a placeholder where none exists
          - vendetta-pipeline # scrape official gallery + import VEN reveals
          - probe-sg         # read-only Singapore store scan (no DB writes)
          - probe-url        # read-only page fetch + font/style diagnostics (url input)
          - probe-imgur      # read-only: render an Imgur album (JS SPA — curl gets an empty shell) and dump every full-res image URL (url input)
          - probe-render     # read-only: render ANY page with a real browser and dump its heading outline, repeated item components, tables, images, palette + full-page screenshot (url input). For researching client-rendered sites that probe-url only sees as an empty shell.
          - smoke-pages     # read-only: assert the key pages return real server-rendered content (post-deploy gate; url input overrides the default production origin)
          - adsense-verify   # read-only: the AdSense integration gate against a LIVE origin — /ads.txt (status WITHOUT following redirects, content-type, exact body), robots.txt (Mediapartners-Google / AdsBot-Google must not be disallowed), the CSP allow-list, and the loader + ownership meta on 12 templates. url input overrides the default production origin (use it to test the www host).
          - import-prices    # run the store price importer for this ref's store list
          - import-sealed     # refresh sealed products (stores + eBay AU + TCGplayer US) + self-heal stale rows
          - migrate-history  # Prisma-based top-up: copy PriceHistory/ClickEvent from EVERY older source into the newest history DB (tolerates unreadable sources, dedupes). Slower/more transfer than migrate-history-db — prefer that for the bulk copy.
          - migrate-history-db # LEGACY (RH6 → RH7 cutover, kept for reference): full pg_dump/restore of the HISTORY database (RH6) into RH7 + row-count verification.
          - migrate-history-db-to-hdu # CURRENT history cutover: full pg_dump/restore of RH7 into HISTORY_DATABASE_URL + row-count verification. Rotates BACK onto the oldest project in the chain, whose monthly Neon allowance reset at the start of this month, because RH7 is nearing its own. Compressed on the wire, so it is the cheapest way to drain a project that is near its transfer allowance. RUN THIS BEFORE deploying the HISTORY_DATABASE_URL-first chain.
          - audit-ven        # read-only census of VEN cards (chase-tier fields)
          - audit-runes      # read-only census of every set's Rune printings + which lack real art
          - set-rune-art     # attach real English art to placeholder rune printings (OGN 'b' promos, UNL alt arts, SFD Nexus Night) + clear the Chinese-only VEN alt-art prints
          - audit-rarity     # read-only: rarity distribution per set, base prints vs chase prints, + anomalies
          - fix-op-promo-flag # flip isPromo=true for organized-play promos add-tcg-printings.ts mis-tagged (Nexus Night rune cycle)
          - fix-kennen-name  # one-off: rename VEN 155/166 + 197/166 from RiftScribe's "Yordle, Heart of the Tempest" placeholder to "Kennen, Heart of the Tempest" (matches the manually-corrected 197*/166 Signature)
          - audit-history    # read-only per-day price-history diagnostic
          - audit-users      # read-only user/Premium census (no PII printed)
          - audit-clicks     # read-only outbound-click leaderboard per retailer (affiliate-outreach priority)
          - backfill-alert-user-ids # link existing email-keyed price alerts to the accounts that own them (idempotent; honours dry_run)
          - fix-orphan-users # repair FK orphans: delete rows in GameScore/AuthToken/Notification/SellerProfile/CollectionCard whose userId no longer exists in User (they block `prisma db push` from adding the FK, which fails the Vercel build)
          - diagnose-card    # read-only: why does ONE card have no price? dumps its RetailerPrice + eBay carousel rows and re-runs the LIVE eBay search (card input)
          - remove-seed-accounts # one-off: delete @riftcompare.seed bot personas (dead since the forum autoseeder was removed)
          - test-marketplace-stripe # smoke-test CRON_SECRET + both Stripe webhook secrets + a Connect account create/delete round-trip (test or live)
          - check-cards      # read-only: fail if any card page would render a price in one component and "—" in another (hero vs prose vs JSON-LD)
          - probe-databases  # READ-ONLY survey of EVERY database in both rotations (RM5/RM4/RM3/DATABASE_URL_2/DATABASE_URL + RH7…RH5 + the older history vars): which ones still answer, and how many User/MarketplaceListing/Order/SellerProfile rows each holds. Writes nothing. RUN THIS FIRST when data appears to be missing — it tells you which source is worth restoring from.
          - restore-accounts-into-rm5 # copy ONLY the account/marketplace tables from a chosen source (source input: RM4/RM3/DATABASE_URL_2/DATABASE_URL/RH7/RH6/RH5) into RM5, leaving RM5's freshly-rebuilt Card/RetailerPrice catalogue untouched. Aborts before writing anything if the dump fails or the source holds no rows.
          - migrate-main-db-to-du2 # CURRENT operational cutover (2026-08-14): full pg_dump/restore of the live DATABASE_URL project into DATABASE_URL_2 + row-count verification. DATABASE_URL burned 4 of its 5 GB in the two days since the last rotation, so it rotates onto DATABASE_URL_2 — the second project in the chain, idle for months, so its monthly allowance has long since reset (probe-databases on 2026-08-14 confirmed it REACHABLE). DESTRUCTIVE to the target, which still holds a months-old snapshot (104 users vs 151 live); dumps before it restores and verifies row counts after. RUN THIS BEFORE deploying the DATABASE_URL_2-first chain.
          - migrate-main-db-to-original # LEGACY (RM5 → DATABASE_URL cutover, kept for reference): full pg_dump/restore of RM5 into the ORIGINAL project (the DATABASE_URL secret) + row-count verification. Rotates BACK onto the first project this site ever used, whose monthly Neon allowance has reset, because RM5 is nearing its own. DESTRUCTIVE to the target (it still holds the old catalogue it served months ago) — dumps before it restores and verifies row counts after. RUN THIS BEFORE deploying the DATABASE_URL-first chain.
          - migrate-main-db-rm5 # LEGACY (RM4 → RM5 cutover, kept for reference): full pg_dump/restore of the OPERATIONAL database (RM4) into RM5 + row-count verification. RUN THIS FIRST once RM5 is set — every other task already resolves RM5-first. NOTE: needs RM4 to be reachable; it exhausted its transfer allowance on 2026-08-10, so if the dump fails with P1001 the data cannot be drained until RM4's allowance resets or its plan is raised.
          - migrate-main-db-rm4 # LEGACY (RM4 cutover, kept for reference): full pg_dump/restore of the OPERATIONAL database (RM3) into RM4 + row-count verification.
          - migrate-main-db  # LEGACY (RM3 cutover, kept for reference): full pg_dump/restore of the OPERATIONAL database (old DATABASE_URL_2) into RM3 + row-count verification. Read-only against the source; skips PriceHistory/ClickEvent data (served from the history project, RH7) to conserve the source's exhausted transfer allowance. RUN THIS BEFORE any other task once RM3 is set.
      dry_run:
        description: "Dry run (log what would change, write nothing)"
        type: boolean
        default: false
      overwrite_live_db:
        description: "migrate-main-db-to-du2 only: allow overwriting the database production is CURRENTLY serving (destructive — discards every write since the cutover)"
        type: boolean
        default: false
      ebay_sg:
        description: "import-prices only: also force an eBay SINGAPORE refresh (~1k calls)"
        type: boolean
        default: false
      source:
        description: "restore-accounts-into-rm5 only: which database to copy accounts/marketplace FROM (run probe-databases first)"
        type: choice
        required: false
        default: RM4
        options: [RM4, RM3, DATABASE_URL_2, DATABASE_URL, RH7, RH6, RH5, HISTORY_DATABASE_URL_4]
      url:
        description: "probe-url only: page to fetch for font/style diagnostics"
        type: string
        required: false
      context_marker:
        description: "probe-url only: dump ~2700 chars of raw HTML around the first occurrence of this literal string"
        type: string
        required: false
      context_marker_end:
        description: "probe-url only: if set, print the FULL raw HTML between the first occurrence of context_marker and the first occurrence of this string after it (no length cap) — for pulling a whole content section (e.g. a card gallery) in one shot"
        type: string
        required: false
      base64_dump:
        description: "probe-url only: print the fetched file's full content as base64 (chunked, prefixed/suffixed with markers) — for pulling a binary asset (e.g. an image the sandbox can't reach directly) out through the job log"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # import-prices writes the same tables as the scheduled refresh — join its
    # concurrency group so the two can never run at once. Other tasks keep a
    # per-run group (no cross-blocking).
    concurrency:
      group: ${{ inputs.task == 'import-prices' && 'refresh-prices' || format('maintenance-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      # RM3 is the CURRENT operational project (cut over 2026-07-29 after
      # DATABASE_URL_2 exhausted its monthly network-transfer allowance, exactly
      # as the original DATABASE_URL had before it). Newest-first, matching
      # src/lib/db.ts.
      #
      # migrate-main-db's own step below deliberately does NOT use this default:
      # it pins SOURCE to DATABASE_URL_2/DATABASE_URL (the OLD project it reads
      # FROM) and TARGET to RM3, and aborts outright if the two resolve to the
      # same database.
      #
      # ORDERING: this default points at RM3 from the moment it's set, so run
      # migrate-main-db BEFORE any other task here — otherwise a task like
      # import-prices would happily operate against a still-empty RM3.
      DATABASE_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL || vars.DATABASE_URL || secrets.RM5 || vars.RM5 || secrets.RM4 || vars.RM4 || secrets.RM3 || vars.RM3 }}
      # Which of the chain above actually won, by NAME (never its value). lib/db.ts
      # cannot work this out inside Actions: the chain is collapsed into one
      # DATABASE_URL before the job starts, so process.env.RM5 is always unset there
      # and its warning always said "DATABASE_URL". See src/lib/db.ts.
      DB_SOURCE_NAME: ${{ (secrets.DATABASE_URL_2 || vars.DATABASE_URL_2) && 'DATABASE_URL_2' || (secrets.DATABASE_URL || vars.DATABASE_URL) && 'DATABASE_URL' || (secrets.RM5 || vars.RM5) && 'RM5' || (secrets.RM4 || vars.RM4) && 'RM4' || 'RM3' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Push schema (additive)
        if: inputs.task == 'db-push'
        env:
          # The click/price-history tables can live in a SECOND Neon project
          # (src/lib/db-history.ts). Ordinary pushes never reach it, so new columns
          # (e.g. ClickEvent.path) 500 the admin clicks page until pushed here too.
          # HISTORY_DATABASE_URL is the CURRENT project (2026-08-11, after RH7
          # neared its Neon network-transfer allowance a week into service — see
          # db-history.ts, which explains why this chain is CURRENT-first rather
          # than newest-first). RH7 is the rollback; everything below it is dead.
          HISTORY_DB: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL || secrets.RH7 || vars.RH7 || secrets.RH6 || vars.RH6 || secrets.RH5 || vars.RH5 || secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 || secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 || secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
        run: |
          # --accept-data-loss: some schema changes are intentionally destructive
          # (e.g. dropping a removed feature's tables/columns) — prisma db push
          # otherwise refuses those non-interactively rather than silently letting
          # them through, which is exactly the safety we want; this just supplies
          # the confirmation a human would give interactively.
          npx prisma db push --skip-generate --accept-data-loss
          if [ -n "$HISTORY_DB" ]; then
            echo "Pushing schema to the HISTORY database too…"
            DATABASE_URL="$HISTORY_DB" npx prisma db push --skip-generate --accept-data-loss
          else
            echo "No history-database secret — single-database setup, nothing extra to push."
          fi

      - name: Migrate history to the new history database
        if: inputs.task == 'migrate-history'
        env:
          RH7: ${{ secrets.RH7 || vars.RH7 }}
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
        run: |
          TARGET="${HISTORY_DATABASE_URL:-${RH7:-${RH6:-${RH5:-$HISTORY_DATABASE_URL_4}}}}"
          if [ -z "$TARGET" ]; then
            echo "::error::No target history DB visible to Actions (HISTORY_DATABASE_URL / RH7 / RH6 / RH5 / HISTORY_DATABASE_URL_4)."
            exit 1
          fi
          if [ -z "${HISTORY_DATABASE_URL:-}" ]; then
            echo "::warning::HISTORY_DATABASE_URL is not visible to Actions — this is copying into a project that is NOT the current one. Add it under Settings → Secrets and variables → Actions."
          fi
          echo "Pushing schema to the target history database…"
          # Non-fatal: a forked history DB can carry EXTRA columns this ref's schema
          # doesn't know, which makes the push refuse — the migration doesn't need it.
          DATABASE_URL="$TARGET" npx prisma db push --skip-generate \
            || echo "::warning::schema push refused (destructive diff); continuing"
          npx tsx scripts/migrate-history.ts

      - name: Migrate the HISTORY database (RH6 → RH7) via pg_dump/pg_restore
        # The cheapest CORRECT way to drain a Neon project that has already
        # exhausted its monthly network-transfer allowance — which is exactly why
        # RH7 exists. Mirrors the migrate-main-db step below, scoped to the three
        # tables a history project actually holds (Card is only there as the FK
        # parent for PriceHistory; see ensureHistoryCards() in lib/db-history.ts).
        #
        # WHY NOT the `migrate-history` task above? scripts/migrate-history.ts
        # streams every row over the UNCOMPRESSED Postgres wire protocol and
        # re-reads the whole Card table on top — the most expensive possible way
        # to read a database that is already out of allowance. pg_dump
        # --format=custom compresses on the wire. Keep the Prisma script for what
        # it's better at (multi-source top-ups, tolerating a dead source, dedupe);
        # use THIS for the bulk copy.
        #
        # RE-RUNNABLE: truncates the target's three tables and re-copies, so every
        # run is a full re-sync of the source's CURRENT state. Run it once for the
        # bulk copy, then once more immediately before flipping Vercel to RH7, so
        # anything written in between is included.
        if: inputs.task == 'migrate-history-db'
        env:
          # SOURCE deliberately EXCLUDES RH7 — that's the NEW project we migrate
          # TO. Resolving it with the RH7-first chain used everywhere else would
          # point source and target at the same database, and the migration would
          # silently no-op while reporting every row count as matching. This is
          # not hypothetical: the same trap is documented on migrate-main-db.
          #
          # RH6 leads the source list because that is where the live data is: it
          # served from 2026-07-31 until RH7 replaced it, so it holds every row
          # written in that window. The older vars remain behind it as fallbacks
          # for a re-run against an already-drained RH6.
          SOURCE_HISTORY_URL: ${{ secrets.RH6 || vars.RH6 || secrets.RH5 || vars.RH5 || secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 || secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL || secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 || secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          TARGET_HISTORY_URL: ${{ secrets.RH7 || vars.RH7 }}
          # Only ever used for a "did RH7 accidentally get set to the operational
          # database?" guard before this step truncates anything.
          OPERATIONAL_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL || vars.DATABASE_URL || secrets.RM5 || vars.RM5 || secrets.RM4 || vars.RM4 || secrets.RM3 || vars.RM3 }}
        run: |
          set -uo pipefail

          if [ -z "$TARGET_HISTORY_URL" ]; then
            echo "::error::RH7 is not visible to Actions — add it under Settings → Secrets and variables → Actions (Repository secrets or variables, exact name RH7)."
            exit 1
          fi
          if [ -z "$SOURCE_HISTORY_URL" ]; then
            echo "::error::No SOURCE history database visible (RH6 / RH5 / HISTORY_DATABASE_URL_4 / HISTORY_DATABASE_URL / _2 / _3) — nothing to migrate FROM."
            exit 1
          fi
          if [ "$SOURCE_HISTORY_URL" = "$TARGET_HISTORY_URL" ]; then
            echo "::error::SOURCE and TARGET resolve to the SAME database — RH7 must be a different (new) Neon project than RH6. Aborting before doing anything."
            exit 1
          fi
          if [ -n "${OPERATIONAL_URL:-}" ] && [ "$TARGET_HISTORY_URL" = "$OPERATIONAL_URL" ]; then
            echo "::error::RH7 resolves to the OPERATIONAL database. This step TRUNCATES its target — aborting rather than wiping production data."
            exit 1
          fi

          # Neon runs a newer Postgres major than ubuntu-latest's stock pg_dump
          # (16.x), and pg_dump refuses to dump from a server newer than itself.
          # Install from PGDG's own apt repo rather than guessing a version.
          echo "== Installing PostgreSQL client tools from PGDG =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version; psql --version

          # Catalog statistics only — a few rows of metadata, NOT the tables. Tells
          # us what this migration is about to cost before spending any allowance.
          echo "== Source table sizes (from catalog — negligible transfer) =="
          psql "$SOURCE_HISTORY_URL" -P pager=off -c "
            SELECT relname AS table,
                   to_char(n_live_tup, 'FM999,999,999') AS est_rows,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 20;" 2>&1 || echo "(size report unavailable — continuing)"

          echo "== Creating the schema on RH7 (brand-new project starts empty) =="
          DATABASE_URL="$TARGET_HISTORY_URL" npx prisma db push --skip-generate --accept-data-loss

          # LAST-LINE SAFETY GUARD, checked AFTER the schema exists and BEFORE any
          # destructive statement: a history project holds no accounts. If "User"
          # has rows, RH7 is pointed at a real operational database and the
          # TRUNCATE below would destroy production data.
          USERS=$(psql "$TARGET_HISTORY_URL" -tAc 'SELECT COUNT(*) FROM public."User"' 2>/dev/null || echo "0")
          case "$USERS" in ''|*[!0-9]*) USERS=0;; esac
          if [ "$USERS" -gt 0 ]; then
            echo "::error::Target has $USERS rows in public.\"User\" — that is an OPERATIONAL database, not a history project. Refusing to truncate. Check what the RH7 secret is set to."
            exit 1
          fi
          echo "Target public.\"User\" rows: 0 ✓ (confirmed history-only project)"

          # DUMP BEFORE TRUNCATE, always — if the source refuses reads (fully
          # exhausted), we must not have already destroyed the target's contents.
          echo "== Dumping Card + ClickEvent + PriceHistory from the source (compressed) =="
          if ! pg_dump "$SOURCE_HISTORY_URL" --no-owner --no-acl --format=custom --data-only \
                 -t 'public."Card"' -t 'public."ClickEvent"' -t 'public."PriceHistory"' \
                 -f history.dump; then
            echo "::error::Could not read the SOURCE history database. If RH6 is hard-capped, its history cannot be recovered — the site still works on an empty RH7 (charts and the Index simply rebuild from the next price import onward). Nothing was written to RH7."
            exit 1
          fi
          echo "Dump size: $(du -h history.dump | cut -f1)"

          echo "== Clearing the target's history tables for a clean re-sync =="
          psql "$TARGET_HISTORY_URL" -c 'TRUNCATE public."PriceHistory", public."ClickEvent", public."Card" CASCADE;'

          # ORDER IS LOAD-BEARING: PriceHistory.cardId REFERENCES Card(id), so Card
          # rows must land first or every COPY fails the FK. pg_restore replays
          # archive entries in the order pg_dump wrote them (alphabetical: Card,
          # ClickEvent, PriceHistory) which is coincidentally correct — but relying
          # on alphabetical luck is not a design. Restore Card explicitly first.
          # The dump file is LOCAL, so this second pass costs zero source transfer.
          echo "== Restoring Card (the FK parent) =="
          pg_restore --no-owner --no-acl --data-only -t 'Card' -d "$TARGET_HISTORY_URL" history.dump
          echo "== Restoring ClickEvent + PriceHistory =="
          pg_restore --no-owner --no-acl --data-only -t 'ClickEvent' -t 'PriceHistory' -d "$TARGET_HISTORY_URL" history.dump

          echo "== Verifying row counts (source vs target) =="
          # COUNT(*) transfers a single integer per table rather than re-reading
          # data — do NOT "verify" by re-reading rows; an earlier version of the
          # migrate-main-db job did that and burned the allowance it was saving.
          # set +e so every count is attempted and every error is PRINTED rather
          # than swallowed into a command substitution.
          set +e
          MISMATCH=0
          for T in 'public."Card"' 'public."ClickEvent"' 'public."PriceHistory"'; do
            SRC=$(psql "$SOURCE_HISTORY_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            DST=$(psql "$TARGET_HISTORY_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            case "$SRC" in ''|*[!0-9]*) echo "$T source query FAILED: $SRC"; MISMATCH=1; continue;; esac
            case "$DST" in ''|*[!0-9]*) echo "$T target query FAILED: $DST"; MISMATCH=1; continue;; esac
            if [ "$SRC" = "$DST" ]; then
              echo "$T: source=$SRC target=$DST ✓"
            else
              echo "$T: source=$SRC target=$DST ✗ MISMATCH"
              MISMATCH=1
            fi
          done
          set -e
          if [ "$MISMATCH" = "1" ]; then
            echo "::error::Row-count mismatch — do NOT point Vercel at RH7 yet. Re-run this task, or inspect the pg_restore output above."
            exit 1
          fi
          echo "All tables match — RH7 now holds a full copy of the history data."
          echo ""
          echo "NEXT STEPS (nothing is live on RH7 until you do these):"
          echo "  1. Re-run this task once more immediately before cutting over, so"
          echo "     anything the price importer wrote in the meantime is included."
          echo "  2. RH7 is already FIRST in the chain in src/lib/db-history.ts and"
          echo "     every workflow — so once RH7 is set in Vercel (ALL environments:"
          echo "     Production, Preview, Development) and the project is redeployed,"
          echo "     history reads/writes move to it."
          echo "  3. Leave RH6 set for a rollback window; remove it only once RH7 has"
          echo "     been serving cleanly for a while."
          echo "  4. RH7 buys ~4 days at RH6'"'"'s burn rate. Before you need an RH8,"
          echo "     grep the Vercel logs for [egress-guard:history] — db-history.ts"
          echo "     logs any single history query returning >=1 MB, which names the"
          echo "     model and operation actually draining the allowance."

      - name: Migrate the HISTORY database (RH7 → HISTORY_DATABASE_URL) via pg_dump/pg_restore
        # ROTATING BACK ONTO A RECYCLED PROJECT. RH7 is approaching its monthly
        # network-transfer allowance; HISTORY_DATABASE_URL is the OLDEST project
        # in the chain, retired long ago, and its allowance reset at the start of
        # this month — so it is empty capacity we already own. Neon's caps are
        # per project and per month, which makes re-using a rested project a
        # legitimate move rather than a hack, and it costs nothing.
        #
        # The direction is the only thing unusual here: every other migration in
        # this file moves FORWARD onto a newly provisioned project. This one moves
        # BACK. That inverts the "newest first" convention the chains were written
        # around, so db-history.ts, build-db-push.sh and the workflow env blocks
        # now describe themselves as CURRENT-first instead — see the comment on
        # HISTORY_URL. tests/db-chain.test.ts pins app and build to each other.
        #
        # The cheapest CORRECT way to drain a Neon project that is near its
        # allowance. Mirrors the migrate-main-db step below, scoped to the three
        # tables a history project actually holds (Card is only there as the FK
        # parent for PriceHistory; see ensureHistoryCards() in lib/db-history.ts).
        #
        # WHY NOT the `migrate-history` task above? scripts/migrate-history.ts
        # streams every row over the UNCOMPRESSED Postgres wire protocol and
        # re-reads the whole Card table on top — the most expensive possible way
        # to read a database that is already out of allowance. pg_dump
        # --format=custom compresses on the wire. Keep the Prisma script for what
        # it's better at (multi-source top-ups, tolerating a dead source, dedupe);
        # use THIS for the bulk copy.
        #
        # RE-RUNNABLE: truncates the target's three tables and re-copies, so every
        # run is a full re-sync of the source's CURRENT state. Run it once for the
        # bulk copy, then once more immediately before deploying the new chain, so
        # anything written in between is included.
        #
        # THE TARGET IS AN OLD PROJECT, so unlike the RH6→RH7 migration its schema
        # is not merely empty, it is STALE — it predates every migration since it
        # was retired. `prisma db push` below brings it up to the current schema
        # before anything is restored.
        if: inputs.task == 'migrate-history-db-to-hdu'
        env:
          # SOURCE deliberately EXCLUDES RH7 — that's the NEW project we migrate
          # TO. Resolving it with the RH7-first chain used everywhere else would
          # point source and target at the same database, and the migration would
          # silently no-op while reporting every row count as matching. This is
          # not hypothetical: the same trap is documented on migrate-main-db.
          #
          # RH6 leads the source list because that is where the live data is: it
          # served from 2026-07-31 until RH7 replaced it, so it holds every row
          # written in that window. The older vars remain behind it as fallbacks
          # for a re-run against an already-drained RH6.
          SOURCE_HISTORY_URL: ${{ secrets.RH7 || vars.RH7 }}
          TARGET_HISTORY_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          # Only ever used for a "did RH7 accidentally get set to the operational
          # database?" guard before this step truncates anything.
          OPERATIONAL_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL || vars.DATABASE_URL || secrets.RM5 || vars.RM5 || secrets.RM4 || vars.RM4 || secrets.RM3 || vars.RM3 }}
        run: |
          set -uo pipefail

          if [ -z "$TARGET_HISTORY_URL" ]; then
            echo "::error::HISTORY_DATABASE_URL is not visible to Actions — add it under Settings → Secrets and variables → Actions (exact name HISTORY_DATABASE_URL)."
            exit 1
          fi
          if [ -z "$SOURCE_HISTORY_URL" ]; then
            echo "::error::RH7 is not visible to Actions — nothing to migrate FROM."
            exit 1
          fi
          if [ "$SOURCE_HISTORY_URL" = "$TARGET_HISTORY_URL" ]; then
            echo "::error::SOURCE and TARGET resolve to the SAME database — HISTORY_DATABASE_URL must be a different Neon project than RH7. Aborting before doing anything."
            exit 1
          fi
          if [ -n "${OPERATIONAL_URL:-}" ] && [ "$TARGET_HISTORY_URL" = "$OPERATIONAL_URL" ]; then
            echo "::error::HISTORY_DATABASE_URL resolves to the OPERATIONAL database. This step TRUNCATES its target — aborting rather than wiping production data."
            exit 1
          fi

          # Neon runs a newer Postgres major than ubuntu-latest's stock pg_dump
          # (16.x), and pg_dump refuses to dump from a server newer than itself.
          # Install from PGDG's own apt repo rather than guessing a version.
          echo "== Installing PostgreSQL client tools from PGDG =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version; psql --version

          # Catalog statistics only — a few rows of metadata, NOT the tables. Tells
          # us what this migration is about to cost before spending any allowance.
          echo "== Source table sizes (from catalog — negligible transfer) =="
          psql "$SOURCE_HISTORY_URL" -P pager=off -c "
            SELECT relname AS table,
                   to_char(n_live_tup, 'FM999,999,999') AS est_rows,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 20;" 2>&1 || echo "(size report unavailable — continuing)"

          echo "== Bringing the target's schema up to date (it is an OLD project — its schema predates recent migrations) =="
          DATABASE_URL="$TARGET_HISTORY_URL" npx prisma db push --skip-generate --accept-data-loss

          # LAST-LINE SAFETY GUARD, checked AFTER the schema exists and BEFORE any
          # destructive statement: a history project holds no accounts. If "User"
          # has rows, RH7 is pointed at a real operational database and the
          # TRUNCATE below would destroy production data.
          USERS=$(psql "$TARGET_HISTORY_URL" -tAc 'SELECT COUNT(*) FROM public."User"' 2>/dev/null || echo "0")
          case "$USERS" in ''|*[!0-9]*) USERS=0;; esac
          if [ "$USERS" -gt 0 ]; then
            echo "::error::Target has $USERS rows in public.\"User\" — that is an OPERATIONAL database, not a history project. Refusing to truncate. Check what the HISTORY_DATABASE_URL secret is set to."
            exit 1
          fi
          echo "Target public.\"User\" rows: 0 ✓ (confirmed history-only project)"

          # DUMP BEFORE TRUNCATE, always — if the source refuses reads (fully
          # exhausted), we must not have already destroyed the target's contents.
          echo "== Dumping Card + ClickEvent + PriceHistory from the source (compressed) =="
          if ! pg_dump "$SOURCE_HISTORY_URL" --no-owner --no-acl --format=custom --data-only \
                 -t 'public."Card"' -t 'public."ClickEvent"' -t 'public."PriceHistory"' \
                 -f history.dump; then
            echo "::error::Could not read RH7. If it is hard-capped, its history cannot be drained — the site still works on an empty target (charts and the Index rebuild from the next price import onward). Nothing was written to the target."
            exit 1
          fi
          echo "Dump size: $(du -h history.dump | cut -f1)"

          echo "== Clearing the target's history tables for a clean re-sync =="
          psql "$TARGET_HISTORY_URL" -c 'TRUNCATE public."PriceHistory", public."ClickEvent", public."Card" CASCADE;'

          # ORDER IS LOAD-BEARING: PriceHistory.cardId REFERENCES Card(id), so Card
          # rows must land first or every COPY fails the FK. pg_restore replays
          # archive entries in the order pg_dump wrote them (alphabetical: Card,
          # ClickEvent, PriceHistory) which is coincidentally correct — but relying
          # on alphabetical luck is not a design. Restore Card explicitly first.
          # The dump file is LOCAL, so this second pass costs zero source transfer.
          echo "== Restoring Card (the FK parent) =="
          pg_restore --no-owner --no-acl --data-only -t 'Card' -d "$TARGET_HISTORY_URL" history.dump
          echo "== Restoring ClickEvent + PriceHistory =="
          pg_restore --no-owner --no-acl --data-only -t 'ClickEvent' -t 'PriceHistory' -d "$TARGET_HISTORY_URL" history.dump

          echo "== Verifying row counts (source vs target) =="
          # COUNT(*) transfers a single integer per table rather than re-reading
          # data — do NOT "verify" by re-reading rows; an earlier version of the
          # migrate-main-db job did that and burned the allowance it was saving.
          # set +e so every count is attempted and every error is PRINTED rather
          # than swallowed into a command substitution.
          set +e
          MISMATCH=0
          for T in 'public."Card"' 'public."ClickEvent"' 'public."PriceHistory"'; do
            SRC=$(psql "$SOURCE_HISTORY_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            DST=$(psql "$TARGET_HISTORY_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            case "$SRC" in ''|*[!0-9]*) echo "$T source query FAILED: $SRC"; MISMATCH=1; continue;; esac
            case "$DST" in ''|*[!0-9]*) echo "$T target query FAILED: $DST"; MISMATCH=1; continue;; esac
            if [ "$SRC" = "$DST" ]; then
              echo "$T: source=$SRC target=$DST ✓"
            else
              echo "$T: source=$SRC target=$DST ✗ MISMATCH"
              MISMATCH=1
            fi
          done
          set -e
          if [ "$MISMATCH" = "1" ]; then
            echo "::error::Row-count mismatch — do NOT deploy the HISTORY_DATABASE_URL-first chain yet. Re-run this task, or inspect the pg_restore output above."
            exit 1
          fi
          echo "All tables match — HISTORY_DATABASE_URL now holds a full copy of the history data."
          echo ""
          echo "NEXT STEPS:"
          echo "  1. Re-run this task immediately before deploying, so anything the"
          echo "     price importer wrote to RH7 in the meantime is included."
          echo "  2. src/lib/db-history.ts, scripts/build-db-push.sh and the workflow"
          echo "     chains now put HISTORY_DATABASE_URL FIRST, so a deploy moves"
          echo "     history reads/writes onto it. HISTORY_DATABASE_URL is already"
          echo "     set in Vercel — confirm it is ticked for Production, Preview"
          echo "     AND Development."
          echo "  3. Leave RH7 set as the rollback fallback; remove it only once the"
          echo "     new target has been serving cleanly for a while."
          echo "  4. This buys a fresh monthly allowance, not a fix. The burn rate is"
          echo "     the real problem — grep the Vercel logs for [egress-guard:history];"
          echo "     db-history.ts names getEmptyCardIds() as the first suspect."

      - name: Migrate main (operational) database to RM3
        # Full pg_dump/pg_restore of the ENTIRE operational schema (users, cards,
        # orders, marketplace listings, everything) — unlike the history-DB split,
        # this is transactional data (real accounts, real money via Stripe order
        # records), so a hand-rolled per-model copy is too risky (FK ordering, a
        # missed table, a missed sequence). Neon is vanilla Postgres, so
        # pg_dump/pg_restore copies every table/index/constraint/row exactly in
        # one pass — the proven, boring, correct tool for "copy an entire database."
        #
        # NETWORK TRANSFER (the reason we're here — the source hit its monthly
        # allowance): pg_dump --format=custom is COMPRESSED on the wire, so this
        # is already the cheapest way to read the whole DB once. Two further
        # savings applied below:
        #   • PriceHistory + ClickEvent are excluded with --exclude-table-data.
        #     Those are the two biggest tables by far, and the app does NOT read
        #     them from this database — they live in the history project (RH7,
        #     see src/lib/db-history.ts, which resolves RH7 before DATABASE_URL).
        #     Their table STRUCTURE is still created, so the schema stays complete
        #     and db-history's DATABASE_URL fallback still has somewhere to write
        #     if the whole history chain is ever unset; only the (unused, legacy)
        #     rows are skipped.
        #   • The verification step counts rows via COUNT(*) aggregates, which
        #     transfer a single integer per table rather than re-reading data.
        #     An earlier version of this job re-read whole tables to verify and
        #     burned allowance doing it — do not reintroduce that.
        #
        # Only READS from the old database — never touches production traffic, and
        # is safe to re-run (each run fully re-syncs the target from the source's
        # CURRENT state). Run it once for the bulk copy, then once more right
        # before you flip traffic over, so nothing written in between is lost.
        if: inputs.task == 'migrate-main-db'
        env:
          # SOURCE deliberately EXCLUDES RM3 — it is the OLD (exhausted) project
          # we're migrating away from. Resolving this with the same RM3-first
          # chain the rest of the workflow uses would point source and target at
          # the SAME database and the migration would silently no-op while
          # reporting every row-count as matching.
          SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.RM4 || vars.RM4 || secrets.RM3 || vars.RM3 }}
        run: |
          set -uo pipefail
          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "::error::RM3 secret/variable is not visible to Actions — add it under Settings → Secrets and variables → Actions (Repository secrets or variables, exact name RM3)."
            exit 1
          fi
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::error::No SOURCE database visible (DATABASE_URL_2 / DATABASE_URL) — nothing to migrate FROM."
            exit 1
          fi
          # Hard stop on the failure mode that looks like success: if the resolved
          # source and target are the same connection string, every row count
          # would trivially match and we'd report a "successful" migration that
          # copied nothing.
          if [ "$SOURCE_DATABASE_URL" = "$TARGET_DATABASE_URL" ]; then
            echo "::error::SOURCE and TARGET resolve to the SAME database — RM3 must be a different (new) Neon project than DATABASE_URL_2/DATABASE_URL. Aborting before doing anything."
            exit 1
          fi

          # Neon runs a newer Postgres major version than ubuntu-latest's stock
          # pg_dump (16.x) — pg_dump refuses to dump from a server newer than
          # itself. Install the matching client from PGDG's own apt repo instead
          # of guessing a version; it always tracks Postgres's current release.
          echo "== Installing PostgreSQL client tools from PGDG (matching Neon's server version) =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version; psql --version

          # Cheap pre-flight: read the source's own catalog statistics (a few rows
          # of metadata, NOT the tables themselves) so we know what this migration
          # is about to cost before spending any of the remaining allowance.
          echo "== Source table sizes (from catalog — negligible transfer) =="
          psql "$SOURCE_DATABASE_URL" -P pager=off -c "
            SELECT relname AS table,
                   to_char(n_live_tup, 'FM999,999,999') AS est_rows,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 40;" 2>&1 || echo "(size report unavailable — continuing)"

          echo "== Dumping the operational database (schema + data) =="
          # --exclude-table-data (NOT --exclude-table): keeps the CREATE TABLE and
          # its indexes/constraints so the schema is complete, but skips the rows.
          # See the transfer note in this step's header for why these two are safe
          # to skip — they're served from the history project, not this database.
          pg_dump "$SOURCE_DATABASE_URL" --no-owner --no-acl --format=custom \
            --exclude-table-data='public."PriceHistory"' \
            --exclude-table-data='public."ClickEvent"' \
            -f main.dump
          echo "Dump size: $(du -h main.dump | cut -f1)"

          echo "== Restoring into the new database (existing objects replaced) =="
          set +e
          pg_restore --no-owner --no-acl --clean --if-exists --verbose -d "$TARGET_DATABASE_URL" main.dump > restore.log 2>&1
          RC=$?
          set -e
          echo "pg_restore exit code: $RC — non-zero here is often just harmless ownership/extension warnings on managed Postgres; the row-count check below is the real verification."
          echo "-- restore.log (first 40 lines) --"; head -40 restore.log
          echo "-- restore.log (last 20 lines) --"; tail -20 restore.log

          echo "== Target inventory after restore =="
          psql "$TARGET_DATABASE_URL" -c "SELECT current_database(), current_user" -c "\dn" -c "\dt public.*" 2>&1 | head -60

          echo "== Verifying row counts (source vs target) =="
          # GitHub runs steps with `bash -e {0}` and this script sets pipefail, so
          # a psql failure inside a command substitution would abort the whole step
          # with its error text swallowed into the variable (this exact failure
          # happened: the run died here with zero output). set +e so every count is
          # attempted and every error is PRINTED; non-numeric output = mismatch.
          # Schema-qualify every table (public."Name") rather than relying on
          # search_path resolution immediately after a fresh restore — the target
          # inventory above proved every table exists, yet unqualified lookups
          # failed moments later; qualifying removes that ambiguity outright.
          # There's also no "Session" table in this schema (auth is JWT-cookie
          # based, no DB-backed sessions) — dropped from the check list.
          sleep 3
          set +e
          MISMATCH=0
          for T in 'public."User"' 'public."Card"' 'public."Order"' 'public."MarketplaceListing"' 'public."SellerProfile"' 'public."Counter"' 'public."SupportTicket"' 'public."RetailerPrice"'; do
            SRC=$(psql "$SOURCE_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            DST=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            case "$SRC" in ''|*[!0-9]*) echo "$T source query FAILED: $SRC"; MISMATCH=1; continue;; esac
            case "$DST" in ''|*[!0-9]*) echo "$T target query FAILED: $DST"; MISMATCH=1; continue;; esac
            if [ "$SRC" = "$DST" ]; then
              echo "$T: source=$SRC target=$DST ✓"
            else
              echo "$T: source=$SRC target=$DST ✗ MISMATCH"
              MISMATCH=1
            fi
          done
          set -e
          # PriceHistory / ClickEvent are deliberately absent from the list above:
          # their DATA was excluded from the dump on purpose (see this step's
          # header), so they WILL be empty in the target and would always report a
          # mismatch. That's expected, not a failure — those tables are served
          # from the history project (RH5).
          echo "(PriceHistory + ClickEvent intentionally not copied — served from the history project RH7, see step header.)"
          if [ "$MISMATCH" = "1" ]; then
            echo "::error::Row-count mismatch on at least one table — do NOT cut traffic over to RM3 yet. Re-run this task, or investigate the pg_restore output above."
            exit 1
          fi
          echo "All verified tables match — RM3 now holds a full copy of the operational data."
          echo ""
          echo "NEXT STEPS (nothing is live on RM3 until you do these):"
          echo "  1. Re-run this task once more immediately before cutting over, so"
          echo "     anything written to the old DB in the meantime is included."
          echo "  2. RM3 is already FIRST in the resolution chain in src/lib/db.ts,"
          echo "     package.json's build script and every workflow — so once RM3 is"
          echo "     set in Vercel (all environments) and redeployed, traffic moves."
          echo "  3. Leave DATABASE_URL_2 in place for a rollback window; delete it"
          echo "     only once RM3 has been serving cleanly for a while."

      - name: Restore account/marketplace tables into RM5
        # THE RESCUE, and deliberately NOT migrate-main-db-rm5.
        #
        # That task does a full `pg_restore --clean`: it drops and replaces every
        # table, which would take RM5's freshly-rebuilt card catalogue and its
        # corrected rune prices back to RM4's 2026-08-10 snapshot. This copies
        # ONLY the tables that cannot regenerate themselves — accounts, seller
        # profiles, listings, offers, orders, reviews, collections, tickets — and
        # copies them ADDITIVELY, so nothing already in RM5 is touched and anyone
        # who signed up after the cutover keeps their account.
        #
        # Run `probe-databases` FIRST and pick the source with the most rows.
        if: inputs.task == 'restore-accounts-into-rm5'
        env:
          TARGET_DATABASE_URL: ${{ secrets.RM5 || vars.RM5 }}
          S_RM4: ${{ secrets.RM4 || vars.RM4 }}
          S_RM3: ${{ secrets.RM3 || vars.RM3 }}
          S_DATABASE_URL_2: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 }}
          S_DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          S_RH7: ${{ secrets.RH7 || vars.RH7 }}
          S_RH6: ${{ secrets.RH6 || vars.RH6 }}
          S_RH5: ${{ secrets.RH5 || vars.RH5 }}
          S_HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          SOURCE_NAME: ${{ inputs.source }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ -z "${SOURCE_NAME:-}" ]; then
            echo "::error::Set the 'source' input to the database to restore FROM (run probe-databases first to see which ones still answer)."
            exit 1
          fi
          eval "SOURCE_DATABASE_URL=\${S_${SOURCE_NAME}:-}"
          export SOURCE_DATABASE_URL
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::error::${SOURCE_NAME} is not visible to Actions — add it under Settings → Secrets and variables → Actions, or pick a different source."
            exit 1
          fi
          if [ -z "${TARGET_DATABASE_URL:-}" ]; then
            echo "::error::RM5 is not visible to Actions — nothing to restore INTO."
            exit 1
          fi
          echo "Restoring FROM ${SOURCE_NAME} INTO RM5 (dry_run=${DRY_RUN:-false})"
          npx tsx scripts/restore-accounts.ts

      - name: Probe EVERY database in the rotation (read-only survey)
        # WHERE DID THE ACCOUNTS GO? Answers that question and nothing else.
        #
        # After the RM4 → RM5 cutover on 2026-08-10, RM5 served cards and prices
        # but User / MarketplaceListing / Order / SellerProfile came up empty:
        # RM4 had already stopped answering, so migrate-main-db-rm5 never got to
        # run, and RM5's tables were created empty by `prisma db push` and then
        # repopulated from the PUBLIC sources only (RiftScribe + the store
        # importers). Those sources know about cards. They know nothing about
        # accounts, listings or orders.
        #
        # Recovering that data means finding a database that still holds a copy,
        # and there are more candidates than the obvious one:
        #   * RM4/RM3/DATABASE_URL_2/DATABASE_URL — the operational rotation. Each
        #     was abandoned when it exhausted its monthly transfer allowance, and
        #     Neon's allowance RESETS monthly, so an OLDER project may well be
        #     reachable again even while RM4 is not.
        #   * RH7/RH6/RH5/HISTORY_DATABASE_URL_4 — the history rotation. These are
        #     not a long shot: the original split (migrate-neon.yml) restored ONE
        #     full pg_dump into BOTH the main and the history project, so a
        #     history database can still carry a complete copy of the operational
        #     tables from whenever it was created.
        #
        # STRICTLY READ-ONLY. `SELECT 1` and `SELECT count(*)`, nothing else, and
        # every statement is wrapped so a missing table reports "-" instead of
        # failing the run. It writes to no database, and it never prints a
        # connection string — only which VARIABLE answered, and how many rows it
        # holds. Run this FIRST, then decide which source to restore from.
        if: inputs.task == 'probe-databases'
        env:
          P_RM5: ${{ secrets.RM5 || vars.RM5 }}
          P_RM4: ${{ secrets.RM4 || vars.RM4 }}
          P_RM3: ${{ secrets.RM3 || vars.RM3 }}
          P_DATABASE_URL_2: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 }}
          P_DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          P_RH7: ${{ secrets.RH7 || vars.RH7 }}
          P_RH6: ${{ secrets.RH6 || vars.RH6 }}
          P_RH5: ${{ secrets.RH5 || vars.RH5 }}
          P_HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          P_HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          P_HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
          P_HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
        run: |
          set -uo pipefail
          echo "== Installing PostgreSQL client tools =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"

          # The tables that actually matter for this incident. Cards and prices
          # rebuild themselves from public sources; nothing below can.
          TABLES='User MarketplaceListing Order SellerProfile SupportTicket CollectionCard PriceAlert Card'

          # TWO WAYS THIS PROBE HAS ALREADY LIED, both worth keeping written down.
          #
          # 1. DON'T put the timeout in the SQL. `psql -c "SET statement_timeout=…;
          #    SELECT count(*)"` prints the SET command tag on its own line ABOVE
          #    the number, so the count parses as "SET1429", fails the numeric
          #    test, and every table reports "-". One statement per -c.
          # 2. DON'T put it in PGOPTIONS either. Neon's POOLED endpoints — every
          #    URL here is a "-pooler" host — reject a startup packet carrying
          #    `options`, so `PGOPTIONS='-c statement_timeout=…'` does not slow a
          #    connection down, it REFUSES it. That run reported all ten
          #    databases unreachable including RM5, which was serving the live
          #    site at that moment. A diagnostic that reports total catastrophe
          #    because of its own connection flags is worse than no diagnostic.
          #
          # So the query bound is `timeout`, outside libpq entirely, and the only
          # libpq setting is PGCONNECT_TIMEOUT — an ordinary connection
          # parameter, not a startup option, so the pooler is happy with it.
          export PGCONNECT_TIMEOUT=20

          probe() {
            NAME="$1"; URL="$2"
            if [ -z "$URL" ]; then
              printf '%-26s %s\n' "$NAME" "(not set in Actions)"
              return 0
            fi
            if ! timeout 30 psql "$URL" -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null 2>/tmp/err.$$; then
              printf '%-26s %s\n' "$NAME" "UNREACHABLE — $(tr '\n' ' ' </tmp/err.$$ 2>/dev/null | cut -c1-150)"
              return 0
            fi
            OUT=""
            for T in $TABLES; do
              N=$(timeout 30 psql "$URL" -tAc "SELECT count(*) FROM public.\"$T\"" 2>/dev/null | tr -d ' \n')
              case "$N" in ''|*[!0-9]*) N="-";; esac
              OUT="$OUT $T=$N"
            done
            printf '%-26s REACHABLE %s\n' "$NAME" "$OUT"
            return 0
          }

          echo ""
          echo "===== OPERATIONAL ROTATION (newest first) ====="
          probe "RM5 (current)"        "${P_RM5:-}" || true
          probe "RM4 (previous)"       "${P_RM4:-}" || true
          probe "RM3"                  "${P_RM3:-}" || true
          probe "DATABASE_URL_2"       "${P_DATABASE_URL_2:-}" || true
          probe "DATABASE_URL"         "${P_DATABASE_URL:-}" || true
          echo ""
          echo "===== HISTORY ROTATION (may carry a full early copy) ====="
          probe "RH7 (current)"        "${P_RH7:-}" || true
          probe "RH6"                  "${P_RH6:-}" || true
          probe "RH5"                  "${P_RH5:-}" || true
          probe "HISTORY_DATABASE_URL_4" "${P_HISTORY_DATABASE_URL_4:-}" || true
          probe "HISTORY_DATABASE_URL_3" "${P_HISTORY_DATABASE_URL_3:-}" || true
          probe "HISTORY_DATABASE_URL_2" "${P_HISTORY_DATABASE_URL_2:-}" || true
          probe "HISTORY_DATABASE_URL"  "${P_HISTORY_DATABASE_URL:-}" || true
          echo ""
          echo "Read-only survey complete — nothing was written to any database."
          echo "Pick the reachable source with the highest User/MarketplaceListing"
          echo "counts and restore from it with the restore-accounts-into-rm5 task."
          # A survey must never fail the job on the strength of one dead
          # candidate — a dead candidate IS the finding.
          exit 0

      - name: Migrate main (operational) database to RM5
        # RM4 exhausted its monthly network-transfer allowance on 2026-08-10 —
        # the fifth project to do so (DATABASE_URL → DATABASE_URL_2 → RM3 → RM4).
        # Same procedure as the RM4 cutover, one project further along.
        #
        # THE THING THAT MAKES THIS CUTOVER DIFFERENT: the previous ones were run
        # while the outgoing database still answered. RM4 is already refusing
        # connections ("Can't reach database server at ep-…"), and pg_dump needs
        # it to answer. If the dump below fails with P1001 the data cannot be
        # drained until RM4's allowance resets (Neon bills monthly) or its plan is
        # raised for long enough to copy — a dump is the cheapest possible read,
        # compressed on the wire, so it is the likeliest thing to succeed if
        # ANYTHING can. Do not treat an empty RM5 as a successful migration: the
        # row-count check at the end exists to stop exactly that, and cutting
        # traffic to an empty database would show a reviewer an empty site.
        #
        # SOURCE is pinned to RM4 and TARGET to RM5, deliberately NOT using the
        # job-level DATABASE_URL default — that default now resolves RM5-FIRST,
        # so reusing it would point source and target at the same database and
        # the migration would silently no-op while reporting every row count as
        # matching.
        #
        # PriceHistory/ClickEvent DATA is excluded (schema kept): those are
        # served from the history project (RH7), and copying them would spend
        # the source's already-exhausted allowance on rows this database does
        # not serve.
        #
        # Read-only against RM4 — safe to re-run. Each run fully re-syncs the
        # target from the source's CURRENT state, so run it once for the bulk
        # copy and again immediately before cutting traffic over.
        if: inputs.task == 'migrate-main-db-rm5'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.RM4 || vars.RM4 }}
          TARGET_DATABASE_URL: ${{ secrets.RM5 || vars.RM5 }}
        run: |
          set -uo pipefail
          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "::error::RM5 secret/variable is not visible to Actions — add it under Settings → Secrets and variables → Actions (exact name RM5)."
            exit 1
          fi
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::error::RM4 is not visible to Actions — nothing to migrate FROM."
            exit 1
          fi
          if [ "$SOURCE_DATABASE_URL" = "$TARGET_DATABASE_URL" ]; then
            echo "::error::SOURCE and TARGET resolve to the SAME database — RM5 must be a different (new) Neon project than RM4. Aborting before doing anything."
            exit 1
          fi

          echo "== Installing PostgreSQL client tools from PGDG (matching Neon's server version) =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version; psql --version

          echo "== Can RM4 still be reached at all? =="
          # Asked FIRST and on its own, because "the source is dead" and "the dump
          # is broken" produce very different next steps and the pg_dump error
          # alone does not distinguish them.
          if ! psql "$SOURCE_DATABASE_URL" -tAc "SELECT 1" >/dev/null 2>&1; then
            echo "::error::RM4 is unreachable — its transfer allowance is spent, so there is nothing to dump FROM."
            echo ""
            echo "RM5 has deliberately NOT been touched. Options, in order of preference:"
            echo "  1. Raise RM4's Neon plan briefly (or wait for the monthly allowance to reset), re-run this task, then drop the plan again. This is the only route that preserves users, orders, marketplace listings and support tickets."
            echo "  2. If that data is expendable, run the db-push task against RM5 to create the schema, then cards-sync + cards-manual + import-prices to rebuild the public catalogue and prices from RiftScribe and the store importers. Accounts/orders/listings/tickets would NOT come back."
            echo "Do NOT cut traffic to an empty RM5 in the meantime — the site would render with no cards while an AdSense review is open."
            exit 1
          fi
          echo "RM4 answered — proceeding with the dump."

          echo "== Source table sizes (from catalog — negligible transfer) =="
          psql "$SOURCE_DATABASE_URL" -P pager=off -c "
            SELECT relname AS table,
                   to_char(n_live_tup, 'FM999,999,999') AS est_rows,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 40;" 2>&1 || echo "(size report unavailable — continuing)"

          echo "== Dumping the operational database (schema + data) =="
          # THE DUMP MUST SUCCEED BEFORE THE RESTORE IS ALLOWED TO START. This
          # script runs under `set -uo pipefail` with no `-e`, so a pg_dump that
          # died half-way — exactly what an exhausted transfer allowance looks
          # like, since the connection drops mid-stream rather than being refused
          # up front — used to fall straight through to a `pg_restore --clean`
          # against a TRUNCATED dump. That drops RM5's tables and refills only
          # the part that made it across, turning a failed rescue into a second
          # data loss. Check the exit code, and sanity-check that the dump's
          # table of contents actually contains the tables we came for.
          if ! pg_dump "$SOURCE_DATABASE_URL" --no-owner --no-acl --format=custom \
            --exclude-table-data='public."PriceHistory"' \
            --exclude-table-data='public."ClickEvent"' \
            -f main.dump; then
            echo "::error::pg_dump FAILED against the source — almost certainly its transfer allowance dying mid-stream. RM5 has NOT been touched; a partial dump is never restored."
            exit 1
          fi
          echo "Dump size: $(du -h main.dump | cut -f1)"
          # See the identical guard in migrate-main-db-to-original for why this
          # matches "TABLE DATA public <name> " and not a quoted identifier: the
          # quoted form never matches pg_restore -l's real output. This step has
          # never run (RM4 was already refusing connections when it was written),
          # so the bug was only found when the newer task exercised it.
          for T in User Card MarketplaceListing; do
            if ! pg_restore -l main.dump | grep -qE "TABLE DATA public ${T} "; then
              echo "::error::the dump has no data section for table $T — it is incomplete. RM5 has NOT been touched."
              exit 1
            fi
          done
          echo "Dump contains a data section for every expected table — proceeding to restore."

          echo "== Restoring into RM5 (existing objects replaced) =="
          set +e
          pg_restore --no-owner --no-acl --clean --if-exists --verbose -d "$TARGET_DATABASE_URL" main.dump > restore.log 2>&1
          RC=$?
          set -e
          echo "pg_restore exit code: $RC — non-zero here is often just harmless ownership/extension warnings on managed Postgres; the row-count check below is the real verification."
          echo "-- restore.log (first 40 lines) --"; head -40 restore.log
          echo "-- restore.log (last 20 lines) --"; tail -20 restore.log

          echo "== Target inventory after restore =="
          psql "$TARGET_DATABASE_URL" -c "SELECT current_database(), current_user" -c "\dn" -c "\dt public.*" 2>&1 | head -60

          echo "== Verifying row counts (RM4 vs RM5) =="
          sleep 3
          set +e
          MISMATCH=0
          for T in 'public."User"' 'public."Card"' 'public."Order"' 'public."MarketplaceListing"' 'public."SellerProfile"' 'public."Counter"' 'public."SupportTicket"' 'public."RetailerPrice"'; do
            SRC=$(psql "$SOURCE_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            DST=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            case "$SRC" in ''|*[!0-9]*) echo "$T source query FAILED: $SRC"; MISMATCH=1; continue;; esac
            case "$DST" in ''|*[!0-9]*) echo "$T target query FAILED: $DST"; MISMATCH=1; continue;; esac
            if [ "$SRC" = "$DST" ]; then
              echo "$T: source=$SRC target=$DST ✓"
            else
              echo "$T: source=$SRC target=$DST ✗ MISMATCH"
              MISMATCH=1
            fi
          done
          set -e
          echo "(PriceHistory + ClickEvent intentionally not copied — served from the history project RH7.)"
          if [ "$MISMATCH" = "1" ]; then
            echo "::error::Row-count mismatch on at least one table — do NOT cut traffic over to RM5 yet."
            exit 1
          fi
          echo "All verified tables match — RM5 now holds a full copy of the operational data."
          echo ""
          echo "NEXT STEPS:"
          echo "  1. Re-run this task immediately before cutting over, so anything"
          echo "     written to RM4 in the meantime is included."
          echo "  2. RM5 is already FIRST in the chain in src/lib/db.ts, the build"
          echo "     script and every workflow — once RM5 is set in Vercel (all"
          echo "     environments) and redeployed, traffic moves."
          echo "  3. Leave RM4 in place as a rollback window; remove it only once"
          echo "     RM5 has been serving cleanly."

      - name: Migrate main (operational) database to DATABASE_URL (the original project)
        # ROTATING THE OPERATIONAL DATABASE BACK ONTO THE ORIGINAL PROJECT.
        # RM5 is nearing its monthly network-transfer allowance; the very first
        # project this site ever used — still held in the DATABASE_URL secret —
        # was retired long enough ago that its allowance has reset, so it is
        # capacity we already own. Same move as the RH7 -> HISTORY_DATABASE_URL
        # history rotation a day earlier, now on the operational side.
        #
        # THE TARGET IS NEITHER EMPTY NOR CURRENT. Probed 2026-08-12, DATABASE_URL
        # still holds the catalogue it served months ago (User=57, Card=1301)
        # against RM5's User=144, Card=1429. `pg_restore --clean` replaces all of
        # it, which is the intent — but it makes this task DESTRUCTIVE to its
        # target, and it means the "target must have zero users" guard that
        # protects the HISTORY migrations cannot be reused here: this target
        # legitimately has users. The protections that do apply are the
        # source/target identity check, dump-before-restore ordering, the dump
        # table-of-contents check, and the row-count verification at the end.
        #
        # DATABASE_URL IS THE MOST DANGEROUS NAME IN THIS REPO TO ROTATE ONTO,
        # which is worth stating here rather than leaving to be discovered.
        # prisma/schema.prisma reads env("DATABASE_URL") directly, nearly every
        # script assigns `DATABASE_URL=<something> npx tsx …` to aim Prisma, and
        # this workflow's own job-level env assigns it too. So after this cutover
        # "DATABASE_URL" means two different things depending on context: the
        # generic "whichever database this process should talk to", and the
        # specific Neon project at the head of the chain. In production they
        # coincide, which is exactly what would make a mistake here quiet. If
        # there is a next rotation, give the project a fresh name (RM6) rather
        # than recycling the generic one.
        #
        # SOURCE is pinned to RM5 and TARGET to the DATABASE_URL secret,
        # deliberately NOT the job-level DATABASE_URL default — that default
        # resolves the whole chain, so reusing it would point source and target
        # at the same database and the migration would silently no-op while
        # reporting every row count as matching.
        #
        # PriceHistory/ClickEvent DATA is excluded (schema kept): those are served
        # from the history project (HISTORY_DATABASE_URL), and copying them would
        # spend allowance on rows this database does not serve.
        #
        # Read-only against RM5 — safe to re-run. Each run fully re-syncs the
        # target from the source's CURRENT state, so run it once for the bulk copy
        # and again immediately before deploying the new chain.
        if: inputs.task == 'migrate-main-db-to-original'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.RM5 || vars.RM5 }}
          TARGET_DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          set -uo pipefail

          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not visible to Actions — add it under Settings → Secrets and variables → Actions (exact name DATABASE_URL)."
            exit 1
          fi
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::error::RM5 is not visible to Actions — nothing to migrate FROM."
            exit 1
          fi
          if [ "$SOURCE_DATABASE_URL" = "$TARGET_DATABASE_URL" ]; then
            echo "::error::SOURCE and TARGET resolve to the SAME database — the DATABASE_URL secret must point at a DIFFERENT Neon project than RM5. This is the single most likely way to configure this task wrongly, because DATABASE_URL is also the generic name every script assigns. Check what the secret actually holds. Aborting before doing anything."
            exit 1
          fi

          echo "== Installing PostgreSQL client tools from PGDG (matching Neon's server version) =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version; psql --version

          echo "== Can RM5 still be reached at all? =="
          if ! psql "$SOURCE_DATABASE_URL" -tAc "SELECT 1" >/dev/null 2>&1; then
            echo "::error::RM5 is unreachable — its transfer allowance is spent, so there is nothing to dump FROM. DATABASE_URL has NOT been touched."
            exit 1
          fi
          echo "RM5 answered — proceeding."

          echo "== Source table sizes (from catalog — negligible transfer) =="
          psql "$SOURCE_DATABASE_URL" -P pager=off -c "
            SELECT relname AS table,
                   to_char(n_live_tup, 'FM999,999,999') AS est_rows,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 40;" 2>&1 || echo "(size report unavailable — continuing)"

          echo "== What the target holds BEFORE we replace it =="
          # Printed for the record, because this restore is destructive and these
          # counts are the only evidence of what was there if a rollback is ever
          # needed. Catalog-cheap: COUNT(*) transfers one integer per table.
          for T in 'public."User"' 'public."Card"' 'public."MarketplaceListing"' 'public."Order"'; do
            N=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1 | tr -d ' \n')
            echo "  target $T: $N"
          done

          echo "== Dumping the operational database (schema + data) =="
          # THE DUMP MUST SUCCEED BEFORE THE RESTORE IS ALLOWED TO START. This
          # script runs under `set -uo pipefail` with no `-e`, so a pg_dump that
          # died half-way — exactly what an exhausted allowance looks like, since
          # the connection drops mid-stream rather than being refused up front —
          # would otherwise fall straight through to a `pg_restore --clean`
          # against a TRUNCATED dump, dropping the target's tables and refilling
          # only the part that made it across.
          if ! pg_dump "$SOURCE_DATABASE_URL" --no-owner --no-acl --format=custom \
            --exclude-table-data='public."PriceHistory"' \
            --exclude-table-data='public."ClickEvent"' \
            -f main.dump; then
            echo "::error::pg_dump FAILED against RM5 — almost certainly its transfer allowance dying mid-stream. DATABASE_URL has NOT been touched; a partial dump is never restored."
            exit 1
          fi
          echo "Dump size: $(du -h main.dump | cut -f1)"
          # MATCH THE TOC'S ACTUAL FORMAT. `pg_restore -l` prints entries as
          #   3803; 0 16385 TABLE DATA public User postgres
          # with the identifier UNQUOTED, so the first version of this guard —
          # grep for "\"$T\"" — could never match and failed a perfectly good
          # 4.3 MB dump on the first real run. It failed SAFE (the target is only
          # touched after this passes), but a check that always fails is a check
          # that gets deleted rather than fixed, so: anchor on "TABLE DATA public
          # <name> " instead. The trailing space matters — without it "Card"
          # would also match "CollectionCard". TABLE DATA rather than TABLE is
          # deliberate: it is the data section that a truncated dump loses, and
          # pg_dump emits a TABLE DATA entry even for a table with zero rows.
          for T in User Card MarketplaceListing; do
            if ! pg_restore -l main.dump | grep -qE "TABLE DATA public ${T} "; then
              echo "::error::the dump has no data section for table $T — it is incomplete. DATABASE_URL has NOT been touched."
              exit 1
            fi
          done
          echo "Dump contains a data section for every expected table — proceeding to restore."

          echo "== Restoring into DATABASE_URL (existing objects replaced) =="
          set +e
          pg_restore --no-owner --no-acl --clean --if-exists --verbose -d "$TARGET_DATABASE_URL" main.dump > restore.log 2>&1
          RC=$?
          set -e
          echo "pg_restore exit code: $RC — non-zero here is often just harmless ownership/extension warnings on managed Postgres; the row-count check below is the real verification."
          echo "-- restore.log (first 40 lines) --"; head -40 restore.log
          echo "-- restore.log (last 20 lines) --"; tail -20 restore.log

          echo "== Target inventory after restore =="
          psql "$TARGET_DATABASE_URL" -c "SELECT current_database(), current_user" -c "\dn" -c "\dt public.*" 2>&1 | head -60

          echo "== Verifying row counts (RM5 vs DATABASE_URL) =="
          sleep 3
          set +e
          MISMATCH=0
          for T in 'public."User"' 'public."Card"' 'public."Order"' 'public."MarketplaceListing"' 'public."SellerProfile"' 'public."Counter"' 'public."SupportTicket"' 'public."RetailerPrice"'; do
            SRC=$(psql "$SOURCE_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            DST=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            case "$SRC" in ''|*[!0-9]*) echo "$T source query FAILED: $SRC"; MISMATCH=1; continue;; esac
            case "$DST" in ''|*[!0-9]*) echo "$T target query FAILED: $DST"; MISMATCH=1; continue;; esac
            if [ "$SRC" = "$DST" ]; then
              echo "$T: source=$SRC target=$DST ✓"
            else
              echo "$T: source=$SRC target=$DST ✗ MISMATCH"
              MISMATCH=1
            fi
          done
          set -e
          echo "(PriceHistory + ClickEvent intentionally not copied — served from the history project, now HISTORY_DATABASE_URL.)"
          if [ "$MISMATCH" = "1" ]; then
            echo "::error::Row-count mismatch on at least one table — do NOT deploy the DATABASE_URL-first chain yet."
            exit 1
          fi
          echo "All verified tables match — DATABASE_URL now holds a full copy of the operational data."
          echo ""
          echo "NEXT STEPS:"
          echo "  1. Re-run this task immediately before deploying, so anything the"
          echo "     price importer wrote to RM5 in the meantime is included."
          echo "  2. src/lib/db.ts, scripts/build-db-push.sh and every workflow chain"
          echo "     now put DATABASE_URL FIRST, so a deploy moves traffic onto it."
          echo "     DATABASE_URL is already set in Vercel — confirm it is ticked for"
          echo "     Production, Preview AND Development."
          echo "  3. Leave RM5 set as the rollback fallback; remove it only once the"
          echo "     original project has been serving cleanly for a while."

      - name: Migrate main (operational) database to DATABASE_URL_2
        # 2026-08-14 cutover. The live DATABASE_URL project burned 4 of its 5 GB
        # of monthly network transfer in the TWO DAYS since the RM5 → DATABASE_URL
        # rotation, so it has to move again. DATABASE_URL_2 is the second project
        # in this chain's history — abandoned months ago, which is exactly what
        # makes it usable now: Neon's caps are per project per month, so its
        # allowance reset long ago. probe-databases confirmed it REACHABLE on
        # 2026-08-14 (104 users / 39 listings — a months-old snapshot this restore
        # overwrites wholesale).
        #
        # THE BURN RATE IS NOT FIXED BY THIS TASK. At ~2 GB/day the target lasts
        # about as long as the source did. This buys time to find the cause; it is
        # not the cure, and rotating again without finding it just moves the
        # problem to whichever project is next.
        #
        # SOURCE is pinned to DATABASE_URL and TARGET to DATABASE_URL_2,
        # deliberately NOT using the job-level DATABASE_URL default — once the
        # chain is flipped DATABASE_URL_2-first, reusing that default would point
        # source and target at the same database and the migration would silently
        # no-op while reporting every row count as matching.
        #
        # PriceHistory/ClickEvent DATA is excluded (schema kept): those are served
        # from the history project, and copying them would spend the source's
        # nearly-exhausted allowance on rows this database does not serve.
        #
        # Read-only against the source — safe to re-run. Each run fully re-syncs
        # the target from the source's CURRENT state, so run it once for the bulk
        # copy and again immediately before cutting traffic over.
        if: inputs.task == 'migrate-main-db-to-du2'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 }}
        run: |
          set -uo pipefail

          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_2 is not visible to Actions — add it under Settings → Secrets and variables → Actions (exact name DATABASE_URL_2)."
            exit 1
          fi
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not visible to Actions — nothing to migrate FROM."
            exit 1
          fi
          if [ "$SOURCE_DATABASE_URL" = "$TARGET_DATABASE_URL" ]; then
            echo "::error::SOURCE and TARGET resolve to the SAME database. DATABASE_URL_2 must point at a DIFFERENT Neon project than DATABASE_URL. Aborting before doing anything."
            exit 1
          fi

          # ── SAFETY: never overwrite the database production is serving ──────
          # This task is a ONE-WAY `pg_restore --clean` of SOURCE over TARGET.
          # That is correct BEFORE the cutover deploy, while TARGET is an idle
          # spare. It is destructive AFTER it, once TARGET is live: every row
          # written since the deploy is reverted to the source's frozen
          # snapshot, and the row-count check still reports "all match" because
          # counts are necessarily equal after a --clean restore.
          #
          # This is not hypothetical. On 2026-08-14 the task was re-run ~87
          # minutes after the cutover as a "top-up", on the assumption the
          # importer was still writing to the source. It was not — the source
          # was byte-identical across both runs — so the re-run copied stale
          # data over live data and silently discarded the writes in between.
          #
          # src/lib/db.ts is the authority on which variable production resolves
          # FIRST, and tests/db-chain.test.ts keeps that list honest, so read it
          # here instead of duplicating the chain into yet another place.
          FIRST_IN_CHAIN=$(sed -n '/^const OPERATIONAL_URL =/,/;/p' src/lib/db.ts \
            | grep -oE 'process\.env\.[A-Z_0-9]+' | head -1 | sed 's/process\.env\.//')
          echo "Chain in src/lib/db.ts resolves first: ${FIRST_IN_CHAIN:-<could not parse>}"
          if [ "$FIRST_IN_CHAIN" = "DATABASE_URL_2" ]; then
            if [ "${{ inputs.overwrite_live_db }}" != "true" ]; then
              echo "::error::REFUSING TO RUN — DATABASE_URL_2 is LIVE. src/lib/db.ts resolves it first, so it is the database production is serving right now. This task would restore the frozen DATABASE_URL over it and discard every row written since the cutover (signups, feedback, orders, listings). Nothing has been touched. If you truly intend this — a deliberate rollback to the old project — re-run with overwrite_live_db = true."
              exit 1
            fi
            echo "::warning::DATABASE_URL_2 is LIVE and overwrite_live_db was set. Proceeding with a DESTRUCTIVE overwrite of production data."
          fi

          echo "== Installing PostgreSQL client tools from PGDG (matching Neon's server version) =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version; psql --version

          echo "== Can the source still be reached at all? =="
          if ! psql "$SOURCE_DATABASE_URL" -tAc "SELECT 1" >/dev/null 2>&1; then
            echo "::error::DATABASE_URL is unreachable — its transfer allowance is spent, so there is nothing to dump FROM. DATABASE_URL_2 has NOT been touched."
            exit 1
          fi
          echo "Source answered — proceeding."

          echo "== Source table sizes (from catalog — negligible transfer) =="
          # Doubles as the first real evidence for the egress investigation: the
          # biggest table here is the likeliest thing a hot query is re-reading.
          psql "$SOURCE_DATABASE_URL" -P pager=off -c "
            SELECT relname AS table,
                   to_char(n_live_tup, 'FM999,999,999') AS est_rows,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 40;" 2>&1 || echo "(size report unavailable — continuing)"

          echo "== What the target holds BEFORE we replace it =="
          for T in 'public."User"' 'public."Card"' 'public."MarketplaceListing"' 'public."Order"'; do
            N=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1 | tr -d ' \n')
            echo "  target $T: $N"
          done

          echo "== Dumping the operational database (schema + data) =="
          # The dump MUST succeed before the restore is allowed to start: this
          # runs under `set -uo pipefail` with no `-e`, so a pg_dump that died
          # half-way — what an exhausted allowance looks like, since the
          # connection drops mid-stream rather than being refused up front —
          # would otherwise fall through to a `pg_restore --clean` against a
          # TRUNCATED dump, dropping the target's tables and refilling only the
          # part that made it across.
          if ! pg_dump "$SOURCE_DATABASE_URL" --no-owner --no-acl --format=custom \
            --exclude-table-data='public."PriceHistory"' \
            --exclude-table-data='public."ClickEvent"' \
            -f main.dump; then
            echo "::error::pg_dump FAILED against DATABASE_URL — almost certainly its transfer allowance dying mid-stream. DATABASE_URL_2 has NOT been touched; a partial dump is never restored."
            exit 1
          fi
          echo "Dump size: $(du -h main.dump | cut -f1)"
          # Anchored on "TABLE DATA public <name> " — pg_restore -l prints the
          # identifier UNQUOTED. The trailing space matters: without it "Card"
          # also matches "CollectionCard".
          for T in User Card MarketplaceListing; do
            if ! pg_restore -l main.dump | grep -qE "TABLE DATA public ${T} "; then
              echo "::error::the dump has no data section for table $T — it is incomplete. DATABASE_URL_2 has NOT been touched."
              exit 1
            fi
          done
          echo "Dump contains a data section for every expected table — proceeding to restore."

          echo "== Restoring into DATABASE_URL_2 (existing objects replaced) =="
          set +e
          pg_restore --no-owner --no-acl --clean --if-exists --verbose -d "$TARGET_DATABASE_URL" main.dump > restore.log 2>&1
          RC=$?
          set -e
          echo "pg_restore exit code: $RC — non-zero here is often just harmless ownership/extension warnings on managed Postgres; the row-count check below is the real verification."
          echo "-- restore.log (first 40 lines) --"; head -40 restore.log
          echo "-- restore.log (last 20 lines) --"; tail -20 restore.log

          echo "== Target inventory after restore =="
          psql "$TARGET_DATABASE_URL" -c "SELECT current_database(), current_user" -c "\dn" -c "\dt public.*" 2>&1 | head -60

          echo "== Verifying row counts (DATABASE_URL vs DATABASE_URL_2) =="
          sleep 3
          set +e
          MISMATCH=0
          for T in 'public."User"' 'public."Card"' 'public."Order"' 'public."MarketplaceListing"' 'public."SellerProfile"' 'public."Counter"' 'public."SupportTicket"' 'public."RetailerPrice"' 'public."Feedback"'; do
            SRC=$(psql "$SOURCE_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            DST=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            case "$SRC" in ''|*[!0-9]*) echo "$T source query FAILED: $SRC"; MISMATCH=1; continue;; esac
            case "$DST" in ''|*[!0-9]*) echo "$T target query FAILED: $DST"; MISMATCH=1; continue;; esac
            if [ "$SRC" = "$DST" ]; then
              echo "$T: source=$SRC target=$DST ✓"
            else
              echo "$T: source=$SRC target=$DST ✗ MISMATCH"
              MISMATCH=1
            fi
          done
          set -e
          echo "(PriceHistory + ClickEvent intentionally not copied — served from the history project.)"
          if [ "$MISMATCH" = "1" ]; then
            echo "::error::Row-count mismatch on at least one table — do NOT deploy the DATABASE_URL_2-first chain yet."
            exit 1
          fi
          echo "All verified tables match — DATABASE_URL_2 now holds a full copy of the operational data."
          echo ""
          echo "NEXT STEPS:"
          echo "  1. Re-run this task immediately before deploying, so anything the"
          echo "     price importer wrote to DATABASE_URL in the meantime is included."
          echo "  2. src/lib/db.ts, scripts/build-db-push.sh and every workflow chain"
          echo "     must put DATABASE_URL_2 FIRST, so a deploy moves traffic onto it."
          echo "  3. Leave DATABASE_URL set as the rollback fallback."
          echo "  4. THE BURN RATE IS STILL UNEXPLAINED — ~2 GB/day will exhaust this"
          echo "     project too in roughly two days. Find the cause before it does."

      - name: Migrate main (operational) database to RM4
        # RM3 exhausted its monthly network-transfer allowance, exactly as
        # DATABASE_URL_2 and the original DATABASE_URL did before it. Same
        # procedure as the RM3 cutover, one project further along.
        #
        # SOURCE is pinned to RM3 and TARGET to RM4, deliberately NOT using the
        # job-level DATABASE_URL default — that default now resolves RM4-FIRST,
        # so reusing it would point source and target at the same database and
        # the migration would silently no-op while reporting every row count as
        # matching.
        #
        # PriceHistory/ClickEvent DATA is excluded (schema kept): those are
        # served from the history project (RH7), and copying them would spend
        # the source's already-exhausted allowance on rows this database does
        # not serve.
        #
        # Read-only against RM3 — safe to re-run. Each run fully re-syncs the
        # target from the source's CURRENT state, so run it once for the bulk
        # copy and again immediately before cutting traffic over.
        if: inputs.task == 'migrate-main-db-rm4'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.RM3 || vars.RM3 }}
          TARGET_DATABASE_URL: ${{ secrets.RM4 || vars.RM4 }}
        run: |
          set -uo pipefail
          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "::error::RM4 secret/variable is not visible to Actions — add it under Settings → Secrets and variables → Actions (exact name RM4)."
            exit 1
          fi
          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::error::RM3 is not visible to Actions — nothing to migrate FROM."
            exit 1
          fi
          if [ "$SOURCE_DATABASE_URL" = "$TARGET_DATABASE_URL" ]; then
            echo "::error::SOURCE and TARGET resolve to the SAME database — RM4 must be a different (new) Neon project than RM3. Aborting before doing anything."
            exit 1
          fi

          echo "== Installing PostgreSQL client tools from PGDG (matching Neon's server version) =="
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version; psql --version

          echo "== Source table sizes (from catalog — negligible transfer) =="
          psql "$SOURCE_DATABASE_URL" -P pager=off -c "
            SELECT relname AS table,
                   to_char(n_live_tup, 'FM999,999,999') AS est_rows,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 40;" 2>&1 || echo "(size report unavailable — continuing)"

          echo "== Dumping the operational database (schema + data) =="
          pg_dump "$SOURCE_DATABASE_URL" --no-owner --no-acl --format=custom \
            --exclude-table-data='public."PriceHistory"' \
            --exclude-table-data='public."ClickEvent"' \
            -f main.dump
          echo "Dump size: $(du -h main.dump | cut -f1)"

          echo "== Restoring into RM4 (existing objects replaced) =="
          set +e
          pg_restore --no-owner --no-acl --clean --if-exists --verbose -d "$TARGET_DATABASE_URL" main.dump > restore.log 2>&1
          RC=$?
          set -e
          echo "pg_restore exit code: $RC — non-zero here is often just harmless ownership/extension warnings on managed Postgres; the row-count check below is the real verification."
          echo "-- restore.log (first 40 lines) --"; head -40 restore.log
          echo "-- restore.log (last 20 lines) --"; tail -20 restore.log

          echo "== Target inventory after restore =="
          psql "$TARGET_DATABASE_URL" -c "SELECT current_database(), current_user" -c "\dn" -c "\dt public.*" 2>&1 | head -60

          echo "== Verifying row counts (RM3 vs RM4) =="
          sleep 3
          set +e
          MISMATCH=0
          for T in 'public."User"' 'public."Card"' 'public."Order"' 'public."MarketplaceListing"' 'public."SellerProfile"' 'public."Counter"' 'public."SupportTicket"' 'public."RetailerPrice"'; do
            SRC=$(psql "$SOURCE_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            DST=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM $T" 2>&1)
            case "$SRC" in ''|*[!0-9]*) echo "$T source query FAILED: $SRC"; MISMATCH=1; continue;; esac
            case "$DST" in ''|*[!0-9]*) echo "$T target query FAILED: $DST"; MISMATCH=1; continue;; esac
            if [ "$SRC" = "$DST" ]; then
              echo "$T: source=$SRC target=$DST ✓"
            else
              echo "$T: source=$SRC target=$DST ✗ MISMATCH"
              MISMATCH=1
            fi
          done
          set -e
          echo "(PriceHistory + ClickEvent intentionally not copied — served from the history project RH7.)"
          if [ "$MISMATCH" = "1" ]; then
            echo "::error::Row-count mismatch on at least one table — do NOT cut traffic over to RM4 yet."
            exit 1
          fi
          echo "All verified tables match — RM4 now holds a full copy of the operational data."
          echo ""
          echo "NEXT STEPS:"
          echo "  1. Re-run this task immediately before cutting over, so anything"
          echo "     written to RM3 in the meantime is included."
          echo "  2. RM4 is already FIRST in the chain in src/lib/db.ts, the build"
          echo "     script and every workflow — once RM4 is set in Vercel (all"
          echo "     environments) and redeployed, traffic moves."
          echo "  3. Leave RM3 in place as a rollback window; remove it only once"
          echo "     RM4 has been serving cleanly."

      - name: Backfill PriceAlert.userId from email
        # Price alerts shipped account-free, so existing rows have no owner and
        # would be invisible on /watchlist. Idempotent — only touches rows that
        # are still unlinked — so it is safe to re-run, and safe to run with
        # dry_run first to see the counts before writing anything.
        if: inputs.task == 'backfill-alert-user-ids'
        run: npx tsx scripts/backfill-alert-user-ids.ts

      - name: Repair userId FK orphans
        # WHY THIS EXISTS: a Vercel build died with
        #   insert or update on table "GameScore" violates foreign key constraint
        #   "GameScore_userId_fkey"   ... step=AddForeignKey
        # `prisma db push` cannot add a foreign key while existing data violates
        # it, so the build fails and NOTHING deploys. The offending rows are
        # ORPHANS: a child row whose userId is not in User. Every one of these
        # relations is declared onDelete: Cascade, so had the parent been removed
        # normally these rows would already be gone — they are unreachable by
        # definition, not data anyone can still use.
        #
        # Counts before AND after, and prints both, because a repair that quietly
        # deleted more than expected is precisely what you want to see.
        #
        # Raw SQL rather than Prisma: the schema being out of sync IS the failure,
        # so the generated client may not even load.
        if: inputs.task == 'fix-orphan-users'
        env:
          TARGET_DATABASE_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL || vars.DATABASE_URL || secrets.RM5 || vars.RM5 || secrets.RM4 || vars.RM4 || secrets.RM3 || vars.RM3 }}
        run: |
          set -uo pipefail
          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "::error::No operational database visible to Actions."
            exit 1
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"

          echo "== User rows (the parent every table below hangs off) =="
          psql "$TARGET_DATABASE_URL" -tAc 'SELECT COUNT(*) FROM public."User"'
          echo ""

          set +e
          for T in GameScore AuthToken Notification SellerProfile CollectionCard PriceAlert; do
            echo "== $T =="
            TOTAL=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM public.\"$T\"" 2>&1)
            ORPH=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM public.\"$T\" c LEFT JOIN public.\"User\" u ON u.id = c.\"userId\" WHERE u.id IS NULL" 2>&1)
            echo "  rows=$TOTAL orphans=$ORPH"
            case "$ORPH" in ''|*[!0-9]*) echo "  (orphan count failed: $ORPH — skipping this table)"; continue;; esac
            [ "$ORPH" -eq 0 ] && continue
            if [ -n "${DRY_RUN:-}" ]; then
              echo "  DRY_RUN — would delete $ORPH orphaned row(s)"
              continue
            fi
            psql "$TARGET_DATABASE_URL" -c "DELETE FROM public.\"$T\" c WHERE NOT EXISTS (SELECT 1 FROM public.\"User\" u WHERE u.id = c.\"userId\")" 2>&1
            AFTER=$(psql "$TARGET_DATABASE_URL" -tAc "SELECT COUNT(*) FROM public.\"$T\" c LEFT JOIN public.\"User\" u ON u.id = c.\"userId\" WHERE u.id IS NULL" 2>&1)
            echo "  orphans remaining: $AFTER"
          done
          set -e
          echo ""
          echo "Done — prisma db push can now add the foreign keys. Redeploy."

      - name: Check card-page price consistency (read-only)
        # Guards the exact class of bug this was written for: /card/[id] derived
        # "cheapest price" and "in stock at N stores" in five places from three
        # different sources, and nothing failed when they drifted — every page
        # still returned 200, just self-contradicting. Exits non-zero on any
        # contradiction so this can gate a deploy.
        if: inputs.task == 'check-cards'
        run: npx tsx scripts/check-card-consistency.ts

      - name: Sync cards from RiftScribe (fetch + additive upsert)
        if: inputs.task == 'cards-sync'
        run: |
          npx tsx scripts/fetch-cards.ts
          npx tsx scripts/sync-cards.ts

      - name: Apply manual cards (promos / source-gap backstop)
        if: inputs.task == 'cards-manual'
        run: npx tsx scripts/add-manual-cards.ts

      # Separate from tcg-printings/add-tcg-printings.ts (which only sees products
      # TCGplayer itself sells) — this scrapes riftbound.gg's OWN card-page sitemap,
      # which is the authoritative "this printing officially exists" source and can
      # list a promo before TCGplayer ever carries it as a sellable product. This is
      # the pipeline fetch-promos.ts's regex fix (dropping the "leading digit
      # required" bug that excluded every R-numbered promo rune slug) was actually
      # for — it had never been wired into CI, so that fix sat unused until now.
      - name: Fetch + apply official promo printings (incl. promo runes)
        if: inputs.task == 'fetch-promos'
        run: |
          npx tsx scripts/fetch-promos.ts
          npx tsx scripts/add-promos.ts

      # Creates any printing TCGplayer sells that our RiftScribe-derived catalogue
      # lacks — Showcase/alt-art variants and, crucially, the R-numbered rune cycle
      # ("R04a", "R06b"), which carries no set in its number and no unique name, so
      # it needs TCGplayer's setName to be placed at all. Additive + idempotent:
      # existing printings are skipped by (set|number) and by externalId.
      # Run with dry_run first to review what it would create.
      - name: Add missing TCGplayer printings (variants + rune cycle)
        if: inputs.task == 'tcg-printings'
        run: npx tsx scripts/add-tcg-printings.ts ${{ inputs.dry_run && '--dry' || '' }}

      # Cloned promo/rune printings (add-tcg-printings.ts, add-promos.ts) had no
      # independent image source and borrowed a donor card's art — sometimes a
      # different set's version of the same rune, i.e. the wrong specific artwork.
      # Re-scrapes the official gallery for every set (not just Vendetta) and swaps
      # in the real photo where it exists; where it genuinely doesn't, clears
      # Showcase-style variants to the site's existing generated-art placeholder
      # instead of leaving a misleadingly-wrong borrowed photo in place.
      - name: Fix cloned promo/rune art (real photos or a clean placeholder)
        if: inputs.task == 'fix-cloned-art'
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          npx tsx scripts/fetch-official-images.ts
          npx tsx scripts/fix-cloned-art.ts ${{ inputs.dry_run && '--dry' || '' }}

      - name: Probe Singapore stores (read-only market scan)
        if: inputs.task == 'probe-sg'
        run: npx tsx scripts/probe-sg-stores.ts

      # Post-deploy gate. The sandbox these branches are written in cannot reach
      # riftcompare.com, so this is how the smoke test gets run against the REAL
      # deployment — the one check that would have caught the homepage shipping a
      # loading spinner and no content. Read-only: it only issues GETs.
      #
      # --allow-404 affects ONLY routes the check list explicitly marks
      # `optional`, and those exist for exactly the case that failed this gate on
      # 2026-08-03: a branch adds /sets/vendetta/gallery, the gate runs against
      # production before that branch deploys, and the route 404s through no
      # fault of the deployment. Those report `~ SKIP`, visibly. A 404 on any
      # established page still fails the run.
      - name: Smoke-test key pages (real rendered content)
        if: inputs.task == 'smoke-pages'
        run: npx tsx scripts/smoke-pages.ts "${{ inputs.url || 'https://riftcompare.com' }}" --allow-404

      - name: Verify the AdSense integration against a live origin (read-only)
        # WHY THIS IS DISPATCHABLE: the AdSense console reported "ads.txt not
        # found" on 2026-08-10. The dev sandbox's egress proxy answers 403 to
        # CONNECT for riftcompare.com, so the only way to see what the crawler
        # actually gets is from a runner. scripts/adsense-verify.ts fetches over
        # raw HTTP with NO browser and NO JS — the same bytes an unrendered
        # crawler reads — and checks /ads.txt with redirect:"manual", so a 301
        # hop shows up as a non-200 instead of being silently followed.
        #
        # Pass `url` to test a different host. The apex and the www host are
        # DIFFERENT origins to the ads.txt crawler: it fetches ads.txt from the
        # exact domain registered in AdSense, so if the site is registered as
        # www.riftcompare.com that host has to serve the record too.
        #
        # context_marker doubles as a comma-separated path override here (the script
        # reads ADSENSE_VERIFY_PATHS), so a one-off check of specific URLs does not
        # need a code change — which is exactly how the stale card fixture survived.
        if: inputs.task == 'adsense-verify'
        env:
          ADSENSE_VERIFY_PATHS: ${{ inputs.context_marker }}
        run: npx tsx scripts/adsense-verify.ts "${{ inputs.url || 'https://riftcompare.com' }}"

      - name: Probe URL (font/style diagnostics)
        # The dev sandbox's egress proxy blocks most external sites; runners don't.
        # Prints the fetched page's font stack (next/font @font-face families,
        # Google Fonts links, font-family declarations) for design-matching work.
        if: inputs.task == 'probe-url'
        env:
          PROBE_CONTEXT_MARKER: ${{ inputs.context_marker }}
          PROBE_CONTEXT_MARKER_END: ${{ inputs.context_marker_end }}
          PROBE_BASE64_DUMP: ${{ inputs.base64_dump }}
        run: |
          curl -sSL --max-time 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" "${{ inputs.url }}" -o page.html
          echo "== bytes: $(wc -c < page.html)"
          echo "== raw body sample (first 4000 chars — useful for API/JSON endpoints):"
          head -c 4000 page.html; echo
          echo "== font-family declarations:"
          grep -oiE "font-family:[^;}\"]{1,120}" page.html | sort -u | head -40 || true
          echo "== next/font face names:"
          grep -oiE "__[A-Za-z_]+_[0-9a-f]{6}" page.html | sort -u | head -20 || true
          echo "== google fonts / font links:"
          grep -oiE "https://fonts[^\"')]+" page.html | sort -u | head -20 || true
          echo "== linked stylesheets:"
          grep -oiE "/_next/static/css/[^\"']+" page.html | sort -u | head -10 || true
          echo "== card links on the page (count + first 40):"
          grep -oE "/card/[a-z0-9-]+" page.html | sort -u > cards.txt || true
          wc -l < cards.txt
          head -40 cards.txt || true
          echo "== gallery placeholder present?:"
          grep -c "cards appear here as they" page.html || true
          echo "== context around PROBE_CONTEXT_MARKER (if set):"
          if [ -n "$PROBE_CONTEXT_MARKER" ]; then
            python3 -c "import os; html = open('page.html', encoding='utf-8', errors='replace').read(); marker = os.environ['PROBE_CONTEXT_MARKER']; i = html.find(marker); print(html[max(0,i-200):i+2500]) if i != -1 else print('MARKER NOT FOUND ON PAGE')"
          fi
          echo "== ALL occurrences of PROBE_CONTEXT_MARKER, ~180 chars each, up to 40 (if set):"
          if [ -n "$PROBE_CONTEXT_MARKER" ]; then
            python3 -c "import os,re; html = open('page.html', encoding='utf-8', errors='replace').read(); marker = os.environ['PROBE_CONTEXT_MARKER']; idxs = [m.start() for m in re.finditer(re.escape(marker), html)][:40]; [print(f'--- match {n+1} @ {i} ---\n' + html[max(0,i-90):i+90].replace(chr(10), ' ')) for n, i in enumerate(idxs)]; print('TOTAL MATCHES:', len(idxs)) if idxs else print('NO MATCHES')"
          fi
          echo "== FULL raw HTML between PROBE_CONTEXT_MARKER and PROBE_CONTEXT_MARKER_END, no length cap (if both set):"
          if [ -n "$PROBE_CONTEXT_MARKER" ] && [ -n "$PROBE_CONTEXT_MARKER_END" ]; then
            python3 -c "import os; html = open('page.html', encoding='utf-8', errors='replace').read(); s = os.environ['PROBE_CONTEXT_MARKER']; e = os.environ['PROBE_CONTEXT_MARKER_END']; i = html.find(s); j = html.find(e, i + len(s)) if i != -1 else -1; print('START MARKER NOT FOUND') if i == -1 else print('END MARKER NOT FOUND AFTER START') if j == -1 else (print(f'SECTION LENGTH: {j - i} chars'), print(html[i:j]))"
          fi
          echo "== BASE64 dump of the fetched file (if base64_dump=true) — for pulling a binary asset through the log:"
          if [ "$PROBE_BASE64_DUMP" = "true" ]; then
            echo "BASE64_BYTES: $(wc -c < page.html)"
            echo "===BASE64_START==="
            base64 -w0 page.html
            echo
            echo "===BASE64_END==="
          fi
          for css in $(grep -oiE "/_next/static/css/[^\"']+" page.html | sort -u | head -4); do
            echo "== css $css:"
            base="${{ inputs.url }}"
            curl -sSL --max-time 20 "${base%/}$css" | grep -oiE "font-family:[^;}]{1,120}" | sort -u | head -20 || true
          done

      - name: Probe Imgur album (rendered image URLs)
        # Imgur album pages are a client-rendered React SPA — plain curl gets an
        # empty shell with zero image URLs (confirmed: 7.5KB of head tags, no
        # gallery content, 0 card links). Render it with a real browser instead.
        if: inputs.task == 'probe-imgur'
        env:
          PROBE_URL: ${{ inputs.url }}
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          npx tsx scripts/probe-imgur.ts

      # Generic SPA renderer. probe-url is a plain fetch, which is correct for our
      # own pages (it shows what a crawler gets) but returns an empty shell for any
      # client-rendered site — csroi.com gave 2.4KB of React skeleton with zero
      # content. This renders properly and dumps the STRUCTURE (heading outline,
      # the repeated item component, tables, palette) rather than raw DOM, so a
      # design reference is legible in a CI log.
      - name: Render any page (generic SPA probe)
        if: inputs.task == 'probe-render'
        # Bounded. The first run of this hung for 25+ minutes on the browser
        # install and had to be cancelled by hand, which is the worst failure
        # mode for a research task — it looks identical to "still working".
        # ubuntu-latest already ships Chromium's system libs, so --with-deps
        # (the apt half, and the part that hung) is dropped.
        timeout-minutes: 10
        env:
          PROBE_URL: ${{ inputs.url }}
        run: |
          npm i --no-save playwright
          npx playwright install chromium
          npx tsx scripts/probe-render.ts

      - name: Upload rendered screenshot (probe-render)
        if: inputs.task == 'probe-render'
        uses: actions/upload-artifact@v4
        with:
          name: probe-render-screenshot
          path: render.png
          if-no-files-found: ignore

      # The chunked marker dump above is fine for a quick font/style check, but a
      # page with a big content section (e.g. a card gallery) needs the whole file —
      # upload it so it can be pulled down directly instead of stitching together
      # dozens of ~2700-char marker windows.
      - name: Upload fetched page (probe-url)
        if: inputs.task == 'probe-url'
        uses: actions/upload-artifact@v4
        with:
          name: probe-url-page
          path: page.html
          if-no-files-found: ignore

      - name: Import store prices (this ref's retailer list)
        if: inputs.task == 'import-prices'
        env:
          # eBay is deliberately NOT refreshed here by default — the scheduled
          # refresh-prices workflow owns the daily quota. EXCEPTION: the ebay_sg
          # input forces a SINGLE-market eBay Singapore pass (~1k calls, safe on
          # top of the daily run) for new-market rollouts.
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
          EBAY_REFRESH: ${{ inputs.ebay_sg && 'true' || 'false' }}
          EBAY_FORCE: ${{ inputs.ebay_sg && '1' || '' }}
          EBAY_ONLY_MARKET: ${{ inputs.ebay_sg && 'SG' || '' }}
          # Route history/click WRITES to the current history project (db-history.ts).
          # RH7 must lead: without it this step's PriceHistory rows land in an
          # exhausted project, or (chain exhausted) in the OPERATIONAL database.
          RH7: ${{ secrets.RH7 || vars.RH7 }}
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
        run: npx tsx scripts/import-prices.ts

      - name: Import sealed products (stores + eBay AU + TCGplayer US)
        if: inputs.task == 'import-sealed'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_AFFILIATE_CAMPAIGN: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN }}
        run: npx tsx scripts/import-sealed.ts

      # Read-only. Compares every set's rarity distribution, splitting base prints
      # from chase prints so the comparison is apples-to-apples — a chase print
      # carries the rarity of the card it re-prints, which is how ~30 Vendetta
      # cards ended up under the "Rare" filter.
      - name: Audit rarity across sets (read-only census)
        if: inputs.task == 'audit-rarity'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_2 || vars.DATABASE_URL_2 || secrets.DATABASE_URL || vars.DATABASE_URL || secrets.RM5 || vars.RM5 || secrets.RM4 || vars.RM4 || secrets.RM3 || vars.RM3 }}
          # Which of the chain above actually won, by NAME (never its value). lib/db.ts
          # cannot work this out inside Actions: the chain is collapsed into one
          # DATABASE_URL before the job starts, so process.env.RM5 is always unset there
          # and its warning always said "DATABASE_URL". See src/lib/db.ts.
          DB_SOURCE_NAME: ${{ (secrets.DATABASE_URL_2 || vars.DATABASE_URL_2) && 'DATABASE_URL_2' || (secrets.DATABASE_URL || vars.DATABASE_URL) && 'DATABASE_URL' || (secrets.RM5 || vars.RM5) && 'RM5' || (secrets.RM4 || vars.RM4) && 'RM4' || 'RM3' }}
        run: npx tsx scripts/audit-rarity.ts

      - name: Audit VEN cards (read-only census)
        if: inputs.task == 'audit-ven'
        run: npx tsx scripts/audit-ven.ts

      - name: Audit rune printings across all sets (read-only census)
        if: inputs.task == 'audit-runes'
        run: npx tsx scripts/audit-runes.ts

      - name: Set real English rune art (fills placeholders, clears wrong-language art)
        if: inputs.task == 'set-rune-art'
        run: npx tsx scripts/set-rune-art.ts ${{ inputs.dry_run && '--dry' || '' }}
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      - name: Fix organized-play promo flag (Nexus Night rune cycle)
        if: inputs.task == 'fix-op-promo-flag'
        run: npx tsx scripts/fix-op-promo-flag.ts ${{ inputs.dry_run && '--dry' || '' }}

      - name: Fix "Yordle, Heart of the Tempest" -> "Kennen, Heart of the Tempest"
        if: inputs.task == 'fix-kennen-name'
        run: npx tsx scripts/fix-kennen-name.ts ${{ inputs.dry_run && '--dry' || '' }}

      # /api/revalidate purges every /card/* page in one call (see
      # revalidateContent() — it has no per-path mode), so the corrected pages
      # show the fixed name immediately instead of waiting out their normal ISR
      # TTL. Same non-fatal pattern as refresh-prices.yml's revalidate step: a
      # failed ping only costs freshness, never data.
      - name: Revalidate site pages (on-demand ISR)
        if: inputs.task == 'fix-kennen-name' && !inputs.dry_run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "No CRON_SECRET secret — skipping (pages fall back to their normal ISR TTL)."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 -X POST \
            "$SITE_URL/api/revalidate" -H "Authorization: Bearer $CRON_SECRET" || true)
          echo "revalidate -> HTTP ${code:-000}"

      - name: Audit price history (read-only)
        if: inputs.task == 'audit-history'
        env:
          RH7: ${{ secrets.RH7 || vars.RH7 }}
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
        run: npx tsx scripts/audit-history.ts

      - name: Audit users/Premium (read-only census)
        if: inputs.task == 'audit-users'
        run: npx tsx scripts/audit-users.ts

      - name: Remove @riftcompare.seed persona accounts
        if: inputs.task == 'remove-seed-accounts'
        run: npx tsx scripts/remove-seed-accounts.ts

      # Every smoke-test step below uses always() so one secret being missing
      # doesn't cascade into GitHub Actions skipping the rest by default (its
      # normal behaviour once any earlier step fails) — each of these checks is
      # independent and should report its own real status regardless of the
      # others.
      - name: "Marketplace smoke test: detect Stripe key mode"
        id: stripe_mode
        if: always() && inputs.task == 'test-marketplace-stripe'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: npx tsx scripts/test-stripe-mode.ts

      - name: "Marketplace smoke test: TEST mode — Connect account create/delete round-trip"
        if: always() && inputs.task == 'test-marketplace-stripe' && steps.stripe_mode.outputs.mode == 'test'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: npx tsx scripts/test-stripe-connect-account.ts

      - name: "Marketplace smoke test: LIVE mode — Connect account create/delete round-trip"
        if: always() && inputs.task == 'test-marketplace-stripe' && steps.stripe_mode.outputs.mode == 'live'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: npx tsx scripts/test-stripe-connect-live.ts

      - name: "Marketplace smoke test: CRON_SECRET against the live cron endpoint"
        if: always() && inputs.task == 'test-marketplace-stripe'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx tsx scripts/test-cron-secret.ts

      - name: "Marketplace smoke test: main Stripe webhook signature (STRIPE_WEBHOOK_SECRET)"
        if: always() && inputs.task == 'test-marketplace-stripe'
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: npx tsx scripts/test-stripe-webhook-signature.ts main

      - name: "Marketplace smoke test: Connect webhook signature (STRIPE_CONNECT_WEBHOOK_SECRET)"
        if: always() && inputs.task == 'test-marketplace-stripe'
        env:
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
        run: npx tsx scripts/test-stripe-webhook-signature.ts connect

      - name: Audit outbound clicks (read-only leaderboard)
        if: inputs.task == 'audit-clicks'
        env:
          RH7: ${{ secrets.RH7 || vars.RH7 }}
          RH6: ${{ secrets.RH6 || vars.RH6 }}
          RH5: ${{ secrets.RH5 || vars.RH5 }}
          HISTORY_DATABASE_URL: ${{ secrets.HISTORY_DATABASE_URL || vars.HISTORY_DATABASE_URL }}
          HISTORY_DATABASE_URL_4: ${{ secrets.HISTORY_DATABASE_URL_4 || vars.HISTORY_DATABASE_URL_4 }}
          HISTORY_DATABASE_URL_2: ${{ secrets.HISTORY_DATABASE_URL_2 || vars.HISTORY_DATABASE_URL_2 }}
          HISTORY_DATABASE_URL_3: ${{ secrets.HISTORY_DATABASE_URL_3 || vars.HISTORY_DATABASE_URL_3 }}
        run: npx tsx scripts/audit-clicks.ts

      # Answers "why does card X have no price?" with evidence instead of a
      # guess: its RetailerPrice rows, its eBay carousel rows, whether those two
      # disagree (the stale-carousel tell), and a LIVE eBay re-search showing
      # what the matcher does with today's listings. Read-only.
      - name: Diagnose one card's pricing
        if: inputs.task == 'diagnose-card'
        env:
          DIAG_CARD: ${{ inputs.url }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: npx tsx scripts/diagnose-card.ts

      - name: Vendetta pipeline (official gallery → import)
        if: inputs.task == 'vendetta-pipeline'
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          DUMP=1 npx tsx scripts/fetch-vendetta-official.ts
          npx tsx scripts/import-vendetta.ts

      # The scraped card list + raw JSON dump, for inspection / parser hardening.
      - uses: actions/upload-artifact@v4
        if: inputs.task == 'vendetta-pipeline' && always()
        with:
          name: vendetta-scrape
          path: |
            prisma/vendetta-cards.json
            scratch/vendetta-dump.json
          if-no-files-found: ignore

      # ── Make new cards DISCOVERABLE immediately ────────────────────────────────
      # Every task above that can ADD or CHANGE a card used to end here, having
      # written to the DB and told nobody. The sitemap children are ISR'd with a 24h
      # TTL, so a card imported now would not appear in /sitemaps/cards.xml until the
      # next price refresh happened to purge it (up to ~9h, or the full 24h if that
      # refresh's own revalidate ping failed) — and indexnow-submit.yml reads the
      # LIVE sitemap at 06:10 UTC, so it would resubmit a list that still omitted
      # them. During a set launch that lag is the whole traffic opportunity.
      #
      # This purges the sitemap (what Google needs) and pings IndexNow with just the
      # newly-created cards + their set hubs (what Bing/Yandex need). The endpoint
      # derives its own URL list from Card.createdAt, so it cannot drift from what
      # the importer actually did — see app/api/cron/ping-new-cards/route.ts.
      #
      # DRY_RUN is excluded: a dry run wrote nothing, so there is nothing to submit.
      - name: Revalidate sitemap + ping IndexNow for new cards
        if: >-
          always() &&
          !inputs.dry_run &&
          contains(fromJSON('["cards-sync","cards-manual","fetch-promos","tcg-printings","vendetta-pipeline","fix-cloned-art","fix-op-promo-flag","set-rune-art","import-prices","import-sealed"]'), inputs.task)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://riftcompare.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "No CRON_SECRET secret — skipping (new cards appear on the sitemap's 24h TTL instead)."
            exit 0
          fi
          # `|| true` so a connection error can't red an otherwise-successful import
          # under `set -eo pipefail` — same convention as refresh-prices.yml. A
          # failed ping only costs freshness, never data.
          body=$(curl -s --max-time 90 -X POST \
            "$SITE_URL/api/cron/ping-new-cards" \
            -H "Authorization: Bearer $CRON_SECRET" || true)
          echo "ping-new-cards -> ${body:-<no response>}"
