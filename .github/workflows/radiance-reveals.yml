name: Radiance reveals import

# Imports Riot's official Radiance reveals into the card database on a schedule
# during Preview Season, so the spoiler tracker (/blog/riftbound-radiance-spoilers)
# and /sets/radiance are current the same day a card is shown — the tracker's own
# promise. Until 2026-09-24 the official-gallery import (maintenance.yml
# `set-pipeline`) only ever ran when someone dispatched it by hand, which during
# a two-week reveal window means reveals land whenever someone remembers.
#
# This DISPATCHES that task rather than copying it: one definition of the
# scrape, its database env (the operational chain lives in maintenance.yml and
# src/lib/db-chains.ts, never in a second workflow), its artifact upload, and
# its sitemap + IndexNow ping for the new cards. A workflow_dispatch made with
# GITHUB_TOKEN does start a run — it is one of the two documented exceptions to
# "GITHUB_TOKEN events trigger nothing".
#
# SELF-RETIRING: runs only from Preview Season's opening (2026-09-25) through
# release week (2026-10-25), then every scheduled run exits at the date gate.
# Twice daily — reveals go out on US daytime, so 18:30 UTC catches the day's
# cards and 02:30 UTC catches anything shown late in the Pacific evening.
#
# PAUSED TO A DRY RUN (2026-09-30). On 30 September the gallery went from 7
# Radiance cards to 84, and its metadata is wrong for many of them while the
# card IMAGES are right: Pillaged Armory filed Calm (the card prints Body),
# Disposal Expert Fury (Chaos), Clocktower Guardian Fury (Mind), Zero Point
# Inflection a Spell and Dockside Lock-Up a Unit (both print GEAR), Supernova
# an Order Unit (a Mind Spell), Kai'Sa SP4/005 4 Might (5). A live import would
# have written those into the catalogue for every card not already added by
# hand. The run still scrapes and logs what it would import, and writes
# nothing. Radiance cards go in through prisma/manual-cards.json, each field
# read off the official image, until a dry run's log matches the printed cards.
#
# Each dispatched set-pipeline run ends with a read-only count of imported cards
# carrying the leaked Deploy / Showoff / Disarm markers, in THAT run's summary
# (scripts/check-leaked-keywords.ts) — this job has no checkout or database.

on:
  schedule:
    - cron: "30 18 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: radiance-reveals
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch set-pipeline for Radiance (inside the reveal window only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$today" \< "2026-09-25" ] || [ "$today" \> "2026-10-25" ]; }; then
            echo "Outside the Radiance reveal window ($today) — nothing to do."
            exit 0
          fi
          # DRY RUN since 2026-09-30: Riot's gallery metadata for Radiance is
          # wrong for many cards (domain and type, sometimes Might), while the
          # card images are right. See the header note. Remove dry_run=true
          # once a dry run's log agrees with the printed cards.
          gh workflow run maintenance.yml --repo "$REPO" --ref main -f task=set-pipeline -f set_slug=radiance -f dry_run=true
          echo "Dispatched maintenance.yml set-pipeline (radiance, dry run) for $today."
