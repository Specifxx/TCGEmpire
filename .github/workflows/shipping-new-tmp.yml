name: TEMP postage for the new stores

# Temporary (2026-10-28 store audit): measures postage for the stores this
# branch adds, merges it into src/lib/shipping-rates.json and commits it to the
# branch. Removed before merge.

on:
  push:
    branches: [claude/project-thread-y2202w]
    paths: [probe-in/new-stores.json, .github/workflows/shipping-new-tmp.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        market: [AU, CA, EU, SG, UK, US]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          keys=$(node -e "console.log((require('./probe-in/new-stores.json')['${{ matrix.market }}']||[]).join(','))")
          npx tsx scripts/probe-shipping-rates.ts --store=$keys --out=shipping-${{ matrix.market }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipping-${{ matrix.market }}
          path: shipping-${{ matrix.market }}.json
          if-no-files-found: ignore

  commit:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          path: ship
          pattern: shipping-*
          merge-multiple: true
      - run: |
          npx tsx scripts/build-shipping-rates.ts ship/*.json --summary=ship-summary.md
          mkdir -p probe-out && cp ship/*.json probe-out/ && cp ship-summary.md probe-out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/shipping-rates.json probe-out
          git commit -m "Postage for the stores added in the 2026-10-28 audit (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
