name: Production deploy

# ONE Vercel production build a day, instead of one per push.
#
# WHY. vercel.json's `ignoreCommand` (scripts/vercel-ignore-build.sh) skips
# every push whose commit message lacks the literal marker `[deploy]`. This
# workflow is what supplies that marker on a schedule: it lands one empty
# commit on main, `release: scheduled production deploy [deploy]`, and Vercel
# builds that. The reasoning is in the script's header and in DECISIONS.md
# ("Network transfer: the deploy cadence was the burn", 2026-09-11) — in one
# line: main was receiving 10–30 commits a day, every one a production build
# that prerenders ~770 database-backed pages and clears the ISR page cache, and
# that, not any request handler, is what exhausted eleven Neon projects in a
# row at ~2 GB/day.
#
# WHY AN EMPTY COMMIT AND NOT A DEPLOY HOOK. A deploy hook builds whatever HEAD
# is, and the Ignored Build Step then reads HEAD's commit message — which has
# no marker, so the build would be skipped. The marker has to be ON the commit
# Vercel sees. An empty commit is the smallest thing that satisfies that, needs
# no Vercel token or hook URL, and leaves an auditable line in `git log` saying
# exactly when production last moved.
#
# WHEN. 08:00 UTC — after the 07:00 UTC price import (refresh-prices.yml, ~45
# minutes) and its /api/revalidate call have finished, so the build prerenders
# the day's fresh prices rather than yesterday's and the cache-clearing deploy
# lands as close as possible to the revalidation wave that was happening
# anyway. The 19:00 UTC import keeps refreshing live pages through
# revalidateContent() without a deploy: the Data Cache (unstable_cache) and
# on-demand revalidatePath survive between deploys — only the ISR page cache
# does not, and that is exactly the thing this schedule stops churning.
#
# NOTHING NEW → NO BUILD. On a scheduled run, if the newest commit on main is
# already a `[deploy]` commit, nothing has landed since the last release and
# the job exits without committing. The manual button always deploys.
#
# DEPLOY NOW. Press "Run workflow" here, or put `[deploy]` anywhere in your own
# commit message — the marker is case-insensitive and the gate reads it from
# Vercel's VERCEL_GIT_COMMIT_MESSAGE (falling back to `git log -1`).
#
# PERMISSIONS. `contents: write` is what lets the default GITHUB_TOKEN push to
# main. If main ever gains a branch-protection rule that blocks the token, this
# job fails LOUDLY on the push step — production then simply stays on its
# last release until someone deploys by hand with a `[deploy]` commit; nothing
# silently breaks. A push made with GITHUB_TOKEN does not trigger other GitHub
# Actions workflows (by GitHub's design), but Vercel's GitHub App still
# receives it, which is the only listener this commit exists for.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note, recorded in the release commit message"
        type: string
        required: false

# Never two release commits racing each other.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Enough history to read the newest commit's message; a full clone is
          # not needed for an empty commit on top of HEAD.
          fetch-depth: 2

      - name: Decide whether anything has landed since the last release
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          head_msg="$(git log -1 --format=%B)"
          if [ "$EVENT" = "schedule" ] && printf '%s' "$head_msg" | grep -qiF -- '[deploy]'; then
            echo "Newest commit on main is already a [deploy] release — nothing new since the last build. Skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Land the release commit (Vercel builds this one)
        if: steps.check.outputs.deploy == 'true'
        env:
          REASON: ${{ inputs.reason }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EVENT" = "schedule" ]; then
            subject="release: scheduled production deploy [deploy]"
          else
            subject="release: manual production deploy [deploy]"
          fi
          body="Builds the current main on Vercel. Pushes without [deploy] in their message are skipped by scripts/vercel-ignore-build.sh — see its header."
          if [ -n "${REASON:-}" ]; then
            git commit --allow-empty -m "$subject" -m "$body" -m "Reason: $REASON"
          else
            git commit --allow-empty -m "$subject" -m "$body"
          fi
          git push origin HEAD:main
          echo "Release commit pushed: $(git rev-parse --short HEAD) — Vercel will build it."
