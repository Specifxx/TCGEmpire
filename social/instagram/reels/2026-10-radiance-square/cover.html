<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radiance top 20 cover</title>
<!-- The post's cover: Radiance's 20 most expensive cards, 1080x1080.
     Prices: the cheapest listing in data/public at 2026-10-23 02:07 UTC, before
     postage (top20.json). Rendered to cover.jpg by the render step in POST.md. -->
<style>
@font-face { font-family: "Anton"; src: url(../../fonts/Anton.woff2) format("woff2"); }
@font-face { font-family: "Cinzel"; src: url(../../fonts/Cinzel.woff2) format("woff2"); font-weight: 400 900; }
@font-face { font-family: "Montserrat"; src: url(../../fonts/Montserrat.woff2) format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0a0612; font-family: "Montserrat", sans-serif; color: #fbeefc; }
.bg { position: absolute; inset: -60px; background: url(img/bg-21.jpg) center / cover; opacity: .38; filter: saturate(.8) blur(2px); }
.shade { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 70% at 50% 40%, rgba(10,6,18,.55), rgba(10,6,18,.92)); }
.frame { position: absolute; inset: 14px; border: 2px solid rgba(212,169,79,.55); border-radius: 18px; box-shadow: inset 0 0 0 6px rgba(10,6,18,.6), inset 0 0 0 7px rgba(212,169,79,.22); }
header { position: absolute; top: 34px; left: 0; right: 0; text-align: center; }
.kicker { font-family: "Cinzel"; font-weight: 900; font-size: 22px; letter-spacing: 8px; color: #d4a94f; }
h1 { margin-top: 2px; font-family: "Anton"; font-size: 74px; line-height: 1; letter-spacing: 1px;
  background: linear-gradient(180deg, #fff 0%, #ffd9ef 45%, #ff7cc4 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin-top: 6px; font-size: 19px; font-weight: 700; color: #c9b6d6; }
.grid { position: absolute; top: 182px; left: 34px; right: 34px; display: grid; grid-template-columns: repeat(5, 1fr); row-gap: 14px; }
.cell { text-align: center; }
.thumb { position: relative; margin: 0 auto; width: 95px; height: 133px; border-radius: 8px; overflow: hidden;
  box-shadow: 0 0 0 2px rgba(255,207,90,.75), 0 8px 18px rgba(0,0,0,.6); background: #000; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.land img { position: absolute; width: 133px; height: 95px; left: -19px; top: 19px; transform: rotate(90deg); object-fit: cover; }
.rank { position: absolute; left: 50%; top: -2px; transform: translate(-50%, -40%); min-width: 38px; height: 28px; padding: 0 7px; border-radius: 14px;
  background: #ffcf5a; color: #1a0d00; font-family: "Anton"; font-size: 19px; line-height: 28px; z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.6); }
.cell .wrap { position: relative; padding-top: 10px; }
.name { margin-top: 5px; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price { font-family: "Anton"; font-size: 27px; line-height: 1; color: #34d17e; letter-spacing: .3px; }
footer { position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; color: #a893b8; }
footer b { color: #ffcf5a; font-weight: 900; }
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div><div class="frame"></div>
<header>
  <div class="kicker">RIFTBOUND · RADIANCE</div>
  <h1>THE 20 MOST EXPENSIVE CARDS</h1>
  <div class="sub">Cheapest listing on 23 Oct 2026, US$, before postage</div>
</header>
<div class="grid" id="grid"></div>
<footer>Every card, every store: <b>riftcompare.com</b> · fan-made, not endorsed by Riot Games</footer>
<script>
const SHORT = { "Packed Amphitheater": "Amphitheater" };
fetch("top20.json").catch(() => null);
</script>
<script src="top20.js"></script>
<script>
const fmt = (v) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
const g = document.getElementById("grid");
for (const c of TOP20) {
  const first = SHORT[c.name] ?? c.name.split(",")[0];
  const num = c.num.replace("/167", "");
  const land = c.rank === 7;
  g.insertAdjacentHTML("beforeend", `<div class="cell"><div class="wrap"><span class="rank">#${c.rank}</span>
    <div class="thumb${land ? " land" : ""}"><img src="${c.img}" alt=""></div></div>
    <div class="name">${first} ${num}</div><div class="price">${fmt(c.usd)}</div></div>`);
}
</script>
</body>
</html>
