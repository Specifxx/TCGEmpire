<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <title>RiftCompare</title>
    <style>
      :root { color-scheme: dark; --ink: #0a0f1a; --fg: #e5e9f0; --muted: #8b95a7; --accent: #22c55e; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
      }
      .wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      }
      .brand { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
      .brand .accent { color: var(--accent); }
      .sub { margin-top: 10px; color: var(--muted); font-size: 14px; }
      .spinner {
        margin: 22px auto 0;
        width: 28px; height: 28px;
        border: 3px solid #1e2738;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Respect the OS "reduce motion" setting — a spinner is decoration, and a
         perpetually rotating element is exactly what that setting is for. */
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <!--
      This local page is the shell bundled inside the app binary. In normal use
      the native config (capacitor.config.ts → server.url) loads the live
      https://riftcompare.com over the top of it, so it is only briefly visible
      at launch. When the network is down MainActivity swaps in offline.html
      instead, which is the screen users actually see and can act on.
    -->
    <div class="wrap">
      <div>
        <div class="brand">Rift<span class="accent">Compare</span></div>
        <div class="sub">Loading live Riftbound prices…</div>
        <div class="spinner" role="status" aria-label="Loading"></div>
      </div>
    </div>
  </body>
</html>
