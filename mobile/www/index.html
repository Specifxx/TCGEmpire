<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>RiftCompare</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0f1a;
        color: #e5e9f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .brand { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
      .brand .accent { color: #22c55e; }
      .sub { margin-top: 10px; color: #8b95a7; font-size: 14px; }
      .spinner {
        margin: 22px auto 0;
        width: 28px; height: 28px;
        border: 3px solid #1e2738;
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!--
      This local page is the shell bundled inside the app binary. In normal use
      the native config (capacitor.config.ts → server.url) loads the live
      https://riftcompare.com over the top of it, so this is only briefly visible
      at launch or if the site is unreachable.
    -->
    <div class="wrap">
      <div>
        <div class="brand">Rift<span class="accent">Compare</span></div>
        <div class="sub">Loading the Riftbound price comparison…</div>
        <div class="spinner"></div>
      </div>
    </div>
  </body>
</html>
