<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <title>RiftCompare — Offline</title>
    <style>
      :root { color-scheme: dark; --ink: #0a0f1a; --card: #111827; --line: #1e2738; --fg: #e5e9f0; --muted: #8b95a7; --accent: #22c55e; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: var(--ink); color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
      }
      .wrap {
        position: fixed; inset: 0;
        display: grid; place-items: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      }
      .card {
        width: 100%; max-width: 360px; text-align: center;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 16px; padding: 32px 24px;
      }
      .icon {
        width: 56px; height: 56px; margin: 0 auto 18px;
        display: grid; place-items: center;
        border-radius: 50%; background: #1a2332;
      }
      .icon svg { width: 28px; height: 28px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
      p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
      button {
        margin-top: 22px; width: 100%;
        padding: 13px 20px; font-size: 15px; font-weight: 600;
        color: #04120a; background: var(--accent);
        border: 0; border-radius: 10px; cursor: pointer;
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: translateY(1px); }
      button[disabled] { opacity: 0.6; }
      .status { margin-top: 14px; font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
      .brand { margin-top: 26px; font-size: 13px; color: #55607a; letter-spacing: 0.4px; }
      .brand .accent { color: #2f6f4a; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        </div>
        <h1>You're offline</h1>
        <p>RiftCompare needs a connection to pull live prices from stores. Reconnect and we'll pick up right where you left off.</p>
        <button id="retry" type="button">Try again</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="brand">Rift<span class="accent">Compare</span></div>
      </div>
    </div>
    <script>
      (function () {
        var SITE = "https://riftcompare.com/";
        var btn = document.getElementById("retry");
        var status = document.getElementById("status");
        var autoTries = 0;

        function go() {
          // A plain navigation, not fetch(): this page is served from
          // file:///android_asset, so any fetch/XHR at the site is a
          // cross-origin request from an opaque origin and is blocked before it
          // ever reaches the network. Navigating has no such restriction — and
          // if we are still offline the native OfflineWebViewClient simply
          // lands us back here.
          window.location.replace(SITE);
        }

        btn.addEventListener("click", function () {
          btn.disabled = true;
          status.textContent = "Reconnecting…";
          go();
          // If the navigation fails we are returned to a fresh copy of this
          // page, so re-enabling is only for the case where it silently stalls.
          setTimeout(function () {
            btn.disabled = false;
            status.textContent = "";
          }, 4000);
        });

        // Come back automatically the moment Android reports connectivity.
        window.addEventListener("online", function () {
          status.textContent = "Back online — reloading…";
          setTimeout(go, 400);
        });

        // navigator.onLine can miss a captive-portal-style recovery, so poll a
        // few times with a backoff as a belt-and-braces fallback, then stop and
        // leave it to the button rather than spinning forever in the background.
        (function poll() {
          if (autoTries >= 5) return;
          autoTries++;
          setTimeout(function () {
            if (navigator.onLine) go();
            else poll();
          }, autoTries * 3000);
        })();
      })();
    </script>
  </body>
</html>
